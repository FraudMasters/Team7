# Pre-commit hooks configuration for AgentHR
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

default_stages: [commit]
default_language_version:
  python: python3.11

repos:
  # General file fixes
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        name: Trim Trailing Whitespace
        description: This hook removes trailing whitespace from files.
        exclude: ^(vendor/|third_party/|\.pb\.go$)
      - id: end-of-file-fixer
        name: Fix End of Files
        description: Ensures that a file is either empty or ends with one newline.
        exclude: ^(vendor/|third_party/|\.pb\.go$)
      - id: check-yaml
        name: Check Yaml
        description: This hook checks yaml files for parseable syntax.
        args: [--unsafe]
      - id: check-toml
        name: Check Toml
        description: This hook checks toml files for parseable syntax.
      - id: check-json
        name: Check Json
        description: This hook checks json files for parseable syntax.
      - id: check-added-large-files
        name: Check For Large Files
        description: Prevents large files from being committed.
        args: ['--maxkb=1000']
      - id: check-case-conflict
        name: Check For Case Conflicts
        description: Checks for files that would conflict in case-insensitive filesystems.
      - id: check-merge-conflict
        name: Check For Merge Conflicts
        description: Checks for files that contain merge conflict strings.
      - id: check-symlinks
        name: Check Symlinks
        description: Checks for symlinks that point to nothing.
      - id: detect-private-key
        name: Detect Private Key
        description: Detects the presence of private keys.

  # Secret scanning with detect-secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: Detect Secrets
        description: Detects secrets in code.
        args: [--baseline, .secrets.baseline]
        exclude: ^(vendor/|third_party/|\.eggs/|\.git/|build/|dist/|package-lock.json|poetry\.lock|\.secrets\.baseline$)

  # Python linting with ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        name: Ruff Linter
        description: Run Python linter with Ruff.
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi, jupyter]
        exclude: ^(vendor/|third_party/|\.eggs/|\.git/|build/|dist/)

  # Python code formatting with black
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 24.8.0
    hooks:
      - id: black
        name: Black Formatter
        description: Run Python formatter with Black.
        args: [--line-length=100, --target-version=py311]
        types_or: [python, pyi]
        exclude: ^(vendor/|third_party/|\.eggs/|\.git/|build/|dist/)

  # Type checking with mypy (optional - can be enabled when pyproject.toml is created)
  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v1.11.2
  #   hooks:
  #     - id: mypy
  #       name: Mypy Type Checker
  #       description: Run static type checker with Mypy.
  #       additional_dependencies:
  #         - pydantic>=2.0
  #         - types-requests
  #       exclude: ^(vendor/|third_party/|\.eggs/|tests/|\.git/|build/|dist/)
  #       types_or: [python, pyi]

# CI configuration
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false
