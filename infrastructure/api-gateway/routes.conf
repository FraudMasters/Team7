# API Gateway Routes Configuration
# Конфигурация маршрутов API Gateway
# Этот файл документирует все маршруты API Gateway и их отображение на микросервисы
# This file documents all API Gateway routes and their mappings to microservices
#
# Формат: Справочная конфигурация в стиле NGINX для документации
# Format: NGINX-style reference configuration for documentation
#
# Маршрутизация запросов: API Gateway (порт 8888) -> Микросервисы (порты 8001-8009)
# Request routing: API Gateway (port 8888) -> Microservices (ports 8001-8009)

# =============================================================================
# Сервис 1: Resume Processing Service (Порт 8001)
# Service 1: Resume Processing Service (Port 8001)
# =============================================================================
# Обработка загрузки, парсинга и анализа резюме
# Resume upload, parsing, and analysis handling

location /api/resumes {
    # Маршрут к сервису обработки резюме
    # Route to resume processing service
    proxy_pass http://resume_processing:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Increased timeout for file uploads
    # Увеличенный таймаут для загрузки файлов
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

location /api/resumes/ {
    proxy_pass http://resume_processing:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

location /api/analysis {
    # Анализ резюме и результаты
    # Resume analysis and results
    proxy_pass http://resume_processing:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

location /api/analysis/ {
    proxy_pass http://resume_processing:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

# Дополнительные маршруты обработки резюме
# Additional resume processing routes
location /api/resume-parser {
    proxy_pass http://resume_processing:8001;
}
location /api/work-experience {
    proxy_pass http://resume_processing:8001;
}
location /api/interview-prep {
    proxy_pass http://resume_processing:8001;
}

