# =============================================================================
# CORS и Security Headers (применяются глобально)
# CORS and Security Headers (applied globally)
# =============================================================================
# Эти заголовки настраиваются на уровне API Gateway (Kong или Traefik)
# These headers are configured at the API Gateway level (Kong or Traefik)
#
# Access-Control-Allow-Origin: http://localhost:5173, http://localhost:3000
# Access-Control-Allow-Methods: GET, POST, PUT, DELETE, PATCH, OPTIONS
# Access-Control-Allow-Headers: Authorization, Content-Type, X-Request-ID
# Access-Control-Allow-Credentials: true
# Access-Control-Max-Age: 3600

# =============================================================================
# Rate Limiting (применяется глобально)
# Rate Limiting (applied globally)
# =============================================================================
# Ограничение частоты запросов для предотвращения перегрузки
# Rate limiting to prevent overload
#
# Настройки Kong: / Rate limiting settings for Kong:
#   - 100 запросов в секунду / 100 requests per second
#   - 10000 запросов в час / 10000 requests per hour
#   - Основано на Redis / Based on Redis
#
# Настройки Traefik: / Rate limiting settings for Traefik:
#   - Average: 100 req/s
#   - Burst: 200 req/s

# =============================================================================
# Сводка маршрутов (Route Summary)
# =============================================================================
# Service                | Port  | Paths
# -----------------------|-------|------------------------------------------
# Resume Processing      | 8001  | /api/resumes, /api/analysis, /api/resume-parser
# Matching               | 8002  | /api/matching, /api/comparisons, /api/ranking
# Candidate              | 8003  | /api/candidates, /api/candidate-notes, /api/candidate-tags
# Vacancy                | 8004  | /api/vacancies, /api/saved-searches
# Taxonomy               | 8005  | /api/skill-taxonomies, /api/taxonomy-import-export
# Analytics              | 8006  | /api/analytics, /api/reports, /api/batch
# ATS Simulation         | 8007  | /api/ats, /api/screening
# Notifications          | 8008  | /api/notifications, /api/communications, /api/webhooks
# Integration            | 8009  | /api/integrations, /api/job-integrations, /api/linkedin
#
# API Gateway Proxy Port: 8888
# Admin API Port: 8001 (Kong), 8080 (Traefik Dashboard)
