# JWT Validation Configuration for API Gateway
# Конфигурация JWT валидации для API Gateway
# Этот файл содержит конфигурацию проверки JWT токенов на уровне API Gateway
# This file contains JWT token validation configuration at the API Gateway level
#
# Интеграция с Keycloak: Gateway проверяет JWT токены, выпущенные Keycloak
# Keycloak Integration: Gateway validates JWT tokens issued by Keycloak
#
# API Gateway: Kong (порт 8888) / Port 8888
# Keycloak: http://keycloak:8080
#
# Формат: Декларативная конфигурация Kong с JWT плагином
# Format: Kong declarative configuration with JWT plugin

# =============================================================================
# Kong JWT Plugin Configuration
# Конфигурация JWT плагина Kong
# =============================================================================
# Kong JWT plugin validates JWT tokens using RS256 algorithm (public key verification)
# Плагин JWT Kong проверяет токены с использованием алгоритма RS256 (публичный ключ)

# -----------------------------------------------------------------------------
# 1. JWT Credential (Consumer)
# JWT Credentials (Потребители)
# -----------------------------------------------------------------------------
# В Kong JWT работает по принципу: Consumer -> JWT Credential -> JWT Token
# In Kong JWT works by: Consumer -> JWT Credential -> JWT Token
#
# Для Keycloak интеграции используем подход "anonymous consumer" для всех
# аутентифицированных пользователей с валидным токеном от Keycloak
# For Keycloak integration we use "anonymous consumer" approach for all
# authenticated users with valid token from Keycloak

# Создаем Consumer для Keycloak пользователей
# Create Consumer for Keycloak users
consumers:
  # Анонимный consumer для всех валидных JWT токенов от Keycloak
  # Anonymous consumer for all valid JWT tokens from Keycloak
  - username: keycloak_user
    custom_id: keycloak_authenticated
    tags:
      - keycloak
      - authenticated

  # Service account для межсервисных вызовов (если требуется)
  # Service account for inter-service calls (if needed)
  - username: service_account
    custom_id: service_internal
    tags:
      - internal
      - service-to-service

# -----------------------------------------------------------------------------
# 2. JWT Credentials for Consumers
# JWT учетные данные для потребителей
# -----------------------------------------------------------------------------
# Каждый consumer может иметь JWT credentials (key, secret, algorithm)
# Each consumer can have JWT credentials (key, secret, algorithm)

# JWT Credentials для Keycloak пользователей
# JWT Credentials for Keycloak users
# Примечание: При интеграции с Keycloak нам нужен только публичный ключ
# для верификации подписи, а не secret
# Note: For Keycloak integration we only need public key for signature verification
jwt_credentials:
  # Для Keycloak используем RS256 (алгоритм с асимметричными ключами)
  # For Keycloak we use RS256 (asymmetric key algorithm)
  - consumer: keycloak_user
    algorithm: RS256
    key: "https://keycloak:8080/realms/agenthr"
    # Публичный ключ получается автоматически из JWKS endpoint Keycloak
    # Public key is automatically fetched from Keycloak JWKS endpoint
    rsa_public_key: |
      -----BEGIN PUBLIC KEY-----
      MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA...
      # Публичный ключ Keycloak realm (загружается из Keycloak)
      # Keycloak realm public key (loaded from Keycloak)
      -----END PUBLIC KEY-----

# -----------------------------------------------------------------------------
# 3. JWT Plugin Configuration (Global)
# Конфигурация JWT плагина (Глобальная)
# -----------------------------------------------------------------------------
# JWT плагин применяется ко всем маршрутам, требующим аутентификации
# JWT plugin is applied to all routes requiring authentication

# Альтернатива 1: Глобальный JWT плагин с исключениями
# Alternative 1: Global JWT plugin with exceptions
plugins:
  # JWT Authentication (Global)
  # JWT Аутентификация (Глобальная)
  - name: jwt
    # Не применяем глобально - будем включать по маршруту
    # Do not apply globally - we will enable per-route
    enabled: false
    config:
      # URI to fetch JWKS (JSON Web Key Set) from Keycloak
      # URI для получения JWKS из Keycloak
      uri: https://keycloak:8080/realms/agenthr/protocol/openid-connect/certs

      # Время кэширования JWKS (в миллисекундах)
      # JWKS cache time (in milliseconds)
      cache_hits: 3600000  # 1 hour

      # Алгоритм проверки подписи
      # Signature verification algorithm
      algorithm: RS256

      # Проверка issuer (выпускающего токена)
      # Issuer claim verification
      claims_to_verify:
        - exp  # Срок действия токена / Token expiration
        - nbf  # Не раньше / Not before
        - iss  # Issuer (keycloak:8080/realms/agenthr)

      # Secret key (для HS256) или Public key (для RS256)
      # В случае RS256 и JWKS этот параметр не обязателен
      # Secret key (for HS256) or Public key (for RS256)
      # For RS256 with JWKS, this parameter is optional

# =============================================================================
# Per-Route JWT Configuration
# Пермаршрутная JWT конфигурация
# =============================================================================
# Для некоторых маршрутов JWT не требуется (health check, public endpoints)
# Для остальных маршрутов JWT включается индивидуально
# Some routes don't require JWT (health check, public endpoints)
# For other routes JWT is enabled individually

# Маршруты, требующие аутентификации:
# Routes requiring authentication:
routes_with_auth:
  # Resume Processing (только authenticated пользователи)
  # Resume Processing (authenticated users only)
  - name: resume_processing_routes_jwt
    route: resume_processing_routes
    plugins:
      - name: jwt
        enabled: true
        config:
          uri: https://keycloak:8080/realms/agenthr/protocol/openid-connect/certs
          algorithm: RS256
          claims_to_verify:
            - exp
            - nbf
            - iss

  # Matching Service (только authenticated пользователи)
  # Matching Service (authenticated users only)
  - name: matching_routes_jwt
    route: matching_routes
    plugins:
      - name: jwt
        enabled: true
        config:
          uri: https://keycloak:8080/realms/agenthr/protocol/openid-connect/certs
          algorithm: RS256

  # Candidate Service (только authenticated пользователи)
  # Candidate Service (authenticated users only)
  - name: candidate_routes_jwt
    route: candidate_routes
    plugins:
      - name: jwt
        enabled: true
        config:
          uri: https://keycloak:8080/realms/agenthr/protocol/openid-connect/certs
          algorithm: RS256

  # Vacancy Service (только authenticated пользователи)
  # Vacancy Service (authenticated users only)
  - name: vacancy_routes_jwt
    route: vacancy_routes
    plugins:
      - name: jwt
        enabled: true
        config:
          uri: https://keycloak:8080/realms/agenthr/protocol/openid-connect/certs
          algorithm: RS256

  # Taxonomy Service (только authenticated пользователи)
  # Taxonomy Service (authenticated users only)
  - name: taxonomy_routes_jwt
    route: taxonomy_routes
    plugins:
      - name: jwt
        enabled: true
        config:
          uri: https://keycloak:8080/realms/agenthr/protocol/openid-connect/certs
          algorithm: RS256

  # Analytics Service (только authenticated пользователи)
  # Analytics Service (authenticated users only)
  - name: analytics_routes_jwt
    route: analytics_routes
    plugins:
      - name: jwt
        enabled: true
        config:
          uri: https://keycloak:8080/realms/agenthr/protocol/openid-connect/certs
          algorithm: RS256

  # ATS Simulation Service (только authenticated пользователи)
  # ATS Simulation Service (authenticated users only)
  - name: ats_simulation_routes_jwt
    route: ats_simulation_routes
    plugins:
      - name: jwt
        enabled: true
        config:
          uri: https://keycloak:8080/realms/agenthr/protocol/openid-connect/certs
          algorithm: RS256

  # Notification Service (только authenticated пользователи)
  # Notification Service (authenticated users only)
  - name: notifications_routes_jwt
    route: notifications_routes
    plugins:
      - name: jwt
        enabled: true
        config:
          uri: https://keycloak:8080/realms/agenthr/protocol/openid-connect/certs
          algorithm: RS256

  # Integration Service (только authenticated пользователи)
  # Integration Service (authenticated users only)
  - name: integration_routes_jwt
    route: integration_routes
    plugins:
      - name: jwt
        enabled: true
        config:
          uri: https://keycloak:8080/realms/agenthr/protocol/openid-connect/certs
          algorithm: RS256

# =============================================================================
# Public Endpoints (No Authentication Required)
# Публичные endpoints (Аутентификация не требуется)
# =============================================================================
# Эти маршруты доступны без JWT токена
# These routes are accessible without JWT token

public_routes:
  # Health Check (всегда доступен)
  # Health Check (always available)
  - name: health_check_no_auth
    route: health_check
    plugins:
      - name: jwt
        enabled: false  # Отключаем JWT для health check

  # Login endpoints (если есть публичные endpoints для входа)
  # Login endpoints (if there are public login endpoints)
  # - name: login_no_auth
  #   route: login_route
  #   plugins:
  #     - name: jwt
  #       enabled: false

  # Public API documentation (Swagger/OpenAPI)
  # Публичная документация API (Swagger/OpenAPI)
  # - name: api_docs_no_auth
  #   route: docs_route
  #   plugins:
  #     - name: jwt
  #       enabled: false

# =============================================================================
# Request/Response Transformation for JWT
# Трансформация запросов/ответов для JWT
# =============================================================================
# После успешной проверки JWT, токен может быть передан в бэкенд-сервисы
# After successful JWT validation, token can be passed to backend services

plugins_transform:
  # Forward JWT headers to backend services
  # Передача JWT заголовков в бэкенд-сервисы
  - name: request-transformer
    enabled: true
    config:
      # Добавление заголовков из JWT claims в запрос к бэкенду
      # Adding headers from JWT claims to backend request
      http_method:
        - http_method: POST
          remove:
            - body
      # Добавляем пользовательские заголовки
      # Add custom headers
      headers:
        add:
          # Передаем JWT токен в бэкенд для дополнительной проверки (если нужно)
          # Pass JWT token to backend for additional validation (if needed)
          - X-User-Id: $(uri.capture('user_id', 'sub'))
          - X-User-Email: $(uri.capture('email', 'email'))
          - X-User-Realm: $(uri.capture('realm', 'realm'))
          - X-Client-Id: $(uri.capture('client_id', 'azp'))

# =============================================================================
# Keycloak Integration Details
# Детали интеграции с Keycloak
# =============================================================================
# Keycloak Realm Configuration
# Конфигурация Realm Keycloak

keycloak_config:
  # Keycloak URL
  # URL Keycloak
  url: "http://keycloak:8080"

  # Realm Name
  # Имя Realm
  realm: "agenthr"

  # Client ID для API Gateway
  # Client ID for API Gateway
  client_id: "api-gateway"

  # JWKS Endpoint (JSON Web Key Set)
  # Endpoint для получения публичных ключей
  jwks_url: "http://keycloak:8080/realms/agenthr/protocol/openid-connect/certs"

  # Issuer (iss claim в токене)
  # Issuer (iss claim in token)
  issuer: "http://keycloak:8080/realms/agenthr"

  # Audience (aud claim в токене)
  # Audience (aud claim in token)
  audience: "api-gateway"

  # Token Algorithm
  # Алгоритм токена
  algorithm: "RS256"

  # Token TTL检查 (проверка срока действия)
  # Token TTL validation (expiration check)
  check_exp: true
  check_nbf: true

# =============================================================================
# Role-Based Access Control (RBAC)
# Ролевая модель контроля доступа (RBAC)
# =============================================================================
# После проверки JWT, роли пользователей могут быть извлечены из токена
# After JWT validation, user roles can be extracted from token

# ACL Plugin для проверки ролей
# ACL Plugin for role validation
rbac_config:
  # На уровне маршрутов можно ограничить доступ по ролям
  # At route level, access can be restricted by roles
  - name: acl
    enabled: false  # Включать по необходимости для конкретных маршрутов
    config:
      # Разрешить только определенные роли
      # Allow only specific roles
      allow:
        - admin
        - recruiter
        - hiring_manager

      # Запретить определенные роли
      # Deny specific roles
      deny:
        - blocked
        - suspended

# =============================================================================
# Error Handling
# Обработка ошибок
# =============================================================================
# Когда JWT токен невалиден или отсутствует, Kong возвращает HTTP 401
# When JWT token is invalid or missing, Kong returns HTTP 401

jwt_error_responses:
  # Отсутствует токен (401 Unauthorized)
  # Missing token (401 Unauthorized)
  missing_token:
    status: 401
    message: "Authentication required"
    description_ru: "Требуется аутентификация"

  # Невалидный токен (401 Unauthorized)
  # Invalid token (401 Unauthorized)
  invalid_token:
    status: 401
    message: "Invalid JWT token"
    description_ru: "Невалидный JWT токен"

  # Истекший токен (401 Unauthorized)
  # Expired token (401 Unauthorized)
  expired_token:
    status: 401
    message: "JWT token has expired"
    description_ru: "Срок действия JWT токена истек"

  # Ошибка проверки подписи (401 Unauthorized)
  # Signature verification failed (401 Unauthorized)
  signature_error:
    status: 401
    message: "JWT signature verification failed"
    description_ru: "Ошибка проверки подписи JWT"

# =============================================================================
# Rate Limiting per User
# Ограничение частоты запросов на пользователя
# =============================================================================
# После аутентификации JWT, можно ограничить частоту запросов на пользователя
# After JWT authentication, rate limiting can be applied per user

rate_limiting_per_user:
  - name: rate-limiting
    enabled: true
    config:
      # Ограничение на пользователя (извлекаем из JWT sub claim)
      # Limit per user (extracted from JWT sub claim)
      second: 100
      hour: 10000
      policy: redis
      redis_host: redis
      redis_port: 6379
      redis_database: 2
      # Используем 'sub' claim из JWT как идентификатор пользователя
      # Use 'sub' claim from JWT as user identifier
      limit_by: ip  # Можно изменить на "consumer" для ограничения по JWT sub

# =============================================================================
# Testing JWT Validation
# Тестирование JWT валидации
# =============================================================================
# Примеры команд для тестирования JWT аутентификации
# Example commands to test JWT authentication

# 1. Получение токена из Keycloak
# Get token from Keycloak
# curl -X POST "http://keycloak:8080/realms/agenthr/protocol/openid-connect/token" \
#   -d "client_id=api-gateway" \
#   -d "grant_type=password" \
#   -d "username=testuser" \
#   -d "password=testpass"

# 2. Запрос без токена -> 401 Unauthorized
# Request without token -> 401 Unauthorized
# curl -i http://localhost:8888/api/resumes
# HTTP/1.1 401 Unauthorized
# {"message":"Unauthorized"}

# 3. Запрос с валидным токеном -> 200 OK
# Request with valid token -> 200 OK
# curl -i -H "Authorization: Bearer <JWT_TOKEN>" http://localhost:8888/api/resumes
# HTTP/1.1 200 OK
# {...}

# 4. Запрос с истекшим токеном -> 401 Unauthorized
# Request with expired token -> 401 Unauthorized
# curl -i -H "Authorization: Bearer <EXPIRED_TOKEN>" http://localhost:8888/api/resumes
# HTTP/1.1 401 Unauthorized
# {"message":"JWT token has expired"}

# =============================================================================
# Deployment Notes
# Заметки по развертыванию
# =============================================================================
# 1. В production используйте HTTPS для общения с Keycloak
#    In production, use HTTPS for Keycloak communication
#
# 2. Настраивайте правильный TTL для кэша JWKS
#    Configure proper TTL for JWKS cache
#
# 3. Используйте сертификат SSL/TLS для production deployments
#    Use SSL/TLS certificate for production deployments
#
# 4. Настройте ротацию ключей в Keycloak (ключи могут меняться)
#    Configure key rotation in Keycloak (keys can change)
#
# 5. Мониторьте ошибки аутентификации через Kong logs
#    Monitor authentication errors via Kong logs
#
# 6. Для повышения производительности кэшируйте валидные токены в Redis
#    For better performance, cache valid tokens in Redis

# =============================================================================
# Security Considerations
# Соображения безопасности
# =============================================================================
# 1. Никогда не логируйте JWT токены в plaintext
#    Never log JWT tokens in plaintext
#
# 2. Используйте короткий срок действия токенов (access token: 5-15 минут)
#    Use short token expiration (access token: 5-15 minutes)
#
# 3. Используйте refresh tokens для продления сессии
#    Use refresh tokens to extend sessions
#
# 4. Проверяйте все необходимые claims (iss, sub, aud, exp, nbf)
#    Verify all necessary claims (iss, sub, aud, exp, nbf)
#
# 5. Используйте HTTPS в production
#    Use HTTPS in production
#
# 6. Настраивайте proper CORS headers
#    Configure proper CORS headers
#
# 7. Лимитируйте размер токенов (защита от DoS)
#    Limit token size (DoS protection)

# =============================================================================
# Summary / Сводка
# =============================================================================
# JWT Validation Flow / Процесс валидации JWT:
#
# 1. Client Request (with JWT in Authorization header)
#    Запрос клиента (с JWT в заголовке Authorization)
#         ↓
# 2. Kong API Gateway (Port 8888)
#         ↓
# 3. JWT Plugin extracts token
#    JWT плагин извлекает токен
#         ↓
# 4. Fetch JWKS from Keycloak (cached for 1 hour)
#    Получение JWKS из Keycloak (кэшируется на 1 час)
#         ↓
# 5. Verify signature with public key (RS256)
#    Проверка подписи публичным ключом (RS256)
#         ↓
# 6. Verify claims (iss, exp, nbf, aud)
#    Проверка claims (iss, exp, nbf, aud)
#         ↓
# 7. If valid → Forward to backend service
#    Если валиден → Передача в бэкенд-сервис
#         ↓
# 8. Backend service receives request with user context
#    Бэкенд-сервис получает запрос с контекстом пользователя
#
# If invalid → Return 401 Unauthorized
# Если невалиден → Возврат 401 Unauthorized

# =============================================================================
# Конец файла JWT конфигурации
# End of JWT configuration file
# =============================================================================
