# Rate Limiting and CORS Configuration for API Gateway
# Конфигурация ограничения частоты запросов и CORS для API Gateway
# Этот файл содержит детальную конфигурацию rate limiting и CORS на уровне API Gateway
# This file contains detailed rate limiting and CORS configuration at the API Gateway level
#
# API Gateway: Kong (порт 8888) / Port 8888
# Frontend URLs: http://localhost:5173 (Vite dev), http://localhost:3000 (production build)
#
# Формат: Справочная конфигурация в стиле NGINX с примерами для Kong и Traefik
# Format: NGINX-style reference configuration with examples for Kong and Traefik

# =============================================================================
# Rate Limiting Strategy
# Стратегия ограничения частоты запросов
# =============================================================================
#
# Rate limiting предотвращает перегрузку сервисов и защищает от DDoS атак
# Rate limiting prevents service overload and protects against DDoS attacks
#
# Стратегии ограничения (Limiting Strategies):
# 1. Per-IP limiting: Ограничение по IP-адресу клиента / Limit by client IP
# 2. Per-User limiting: Ограничение по authenticated пользователю (JWT sub) / Limit by authenticated user
# 3. Per-Route limiting: Различные лимиты для разных endpoints / Different limits for different endpoints
# 4. Burst handling: Временное превышение лимита для всплесков трафика / Temporary exceedance for traffic spikes
#
# Бэкенд для хранения счетчиков (Counter storage backend):
# - Redis (рекомендуется для production) / Recommended for production
# - In-memory (для single-instance deployments) / For single-instance deployments

# =============================================================================
# Global Rate Limits (Применяются ко всем запросам)
# Глобальные ограничения частоты запросов
# =============================================================================
#
# Эти лимиты применяются на уровне API Gateway перед routing
# These limits are applied at the API Gateway level before routing
#
# Базовые лимиты (Basic limits):
# - 100 запросов в секунду / 100 requests per second
# - 10,000 запросов в час / 10,000 requests per hour
# - 100,000 запросов в день / 100,000 requests per day

# -----------------------------------------------------------------------------
# NGINX-style configuration (reference)
# Конфигурация в стиле NGINX (справочная)
# -----------------------------------------------------------------------------

# Определяем zone для rate limiting (общая память для счетчиков)
# Define rate limiting zone (shared memory for counters)
limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=api_burst_limit:10m rate=200r/s;

# Определяем zone для connection limiting
# Define connection limiting zone
limit_conn_zone $binary_remote_addr zone=api_conn_limit:10m;

# Apply rate limiting to all API routes
# Применяем rate limiting ко всем API маршрутам
location /api/ {
    # Базовое ограничение: 100 req/s с burst до 200
    # Basic limit: 100 req/s with burst up to 200
    limit_req zone=api_general_limit burst=100 nodelay;

    # Ограничение на количество одновременных соединений
    # Limit on number of simultaneous connections
    limit_conn api_conn_limit 50;

    # Ограничение на скорость передачи данных
    # Limit on data transfer rate
    limit_rate 10m;  # 10 MB per second / 10 МБ в секунду

    # Задержка перед возвратом ошибки (позволяет обработать burst)
    # Delay before returning error (allows burst to be processed)
    limit_req_status 429;  # HTTP 429 Too Many Requests

    # Custom error response for rate limit exceeded
    # Кастомный ответ при превышении лимита
    error_page 429 = @rate_limit_exceeded;
}

# Custom error handler for rate limiting
# Кастомный обработчик ошибок для rate limiting
location @rate_limit_exceeded {
    default_type application/json;
    return 429 '{
        "error": "Rate limit exceeded",
        "error_ru": "Превышен лимит запросов",
        "message": "Too many requests. Please try again later.",
        "message_ru": "Слишком много запросов. Пожалуйста, попробуйте позже.",
        "retry_after": 60
    }';
}

# -----------------------------------------------------------------------------
# Kong Rate Limiting Plugin Configuration
# Конфигурация плагина Rate Limiting для Kong
# -----------------------------------------------------------------------------

# Global rate limiting plugin (applied to all routes)
# Глобальный плагин rate limiting (применяется ко всем маршрутам)
plugins:
  # Rate Limiting (Global)
  # Ограничение частоты запросов (Глобальное)
  - name: rate-limiting
    enabled: true
    config:
      # Ограничение по времени (Limit by time window)
      # Rate limits can be configured per: second, minute, hour, day, month, year
      second: 100        # 100 запросов в секунду / requests per second
      minute: 5000       # 5,000 запросов в минуту / requests per minute
      hour: 10000        # 10,000 запросов в час / requests per hour
      day: 100000        # 100,000 запросов в день / requests per day

      # Политика хранения счетчиков (Counter storage policy)
      # redis: Использовать Redis для distributed rate limiting
      # cluster: Использовать in-memory для single-instance
      # local: Хранить счетчики локально на каждом узле
      policy: redis

      # Redis configuration (when policy=redis)
      # Конфигурация Redis (когда policy=redis)
      redis_host: redis
      redis_port: 6379
      redis_database: 1
      redis_password: null  # Если есть пароль / If password is set
      redis_timeout: 2001   # Timeout in milliseconds / Таймаут в миллисекундах

      # Что использовать для различения клиентов (What to use to distinguish clients)
      # ip: Использовать IP-адрес / Use IP address
      # consumer: Использовать consumer ID (из JWT) / Use consumer ID (from JWT)
      # credential: Использовать credential ID / Use credential ID
      limit_by: ip         # Можно изменить на "consumer" для per-user limiting

      # Fault tolerance: Если Redis недоступен, пропускать запросы
      # Fault tolerance: If Redis is unavailable, allow requests
      fault_tolerant: true

      # Hide client headers: Скрывать заголовки с информацией о лимитах
      # Hide client headers: Hide headers with rate limit info
      hide_client_headers: false

      # Продолжительность блока после превышения лимита
      # Block duration after limit exceeded (не используется в Kong 3.x)
      # block_duration: null

  # Response Rate Limiting (пропускная способность ответов)
  # Ограничение скорости ответов от бэкенда
  - name: response-ratelimiting
    enabled: false  # Включить если нужно ограничить размер ответов
    config:
      # Лимиты на размер ответа (Response size limits)
      # upstream_content_length: Максимальный размер ответа от бэкенда
      # response_headers: Добавлять заголовки с информацией о лимитах
      upstream_content_length: 100000000  # 100 MB / 100 МБ
      response_headers:
        - X-RateLimit-Limit
        - X-RateLimit-Remaining
        - X-RateLimit-Reset

  # IP Restriction (дополнительная защита)
  # Ограничение по IP (дополнительная защита)
  - name: ip-restriction
    enabled: false  # Включить для whitelist/blacklist
    config:
      # Whitelist: Разрешить только эти IP
      # Blacklist: Запретить эти IP
      allow:
        - 10.0.0.0/8     # Внутренняя сеть / Internal network
        - 172.16.0.0/12  # Внутренняя сеть / Internal network
        - 192.168.0.0/16 # Внутренняя сеть / Internal network
      deny:
        - 0.0.0.0/0      # Запретить все (используется с allow)

# -----------------------------------------------------------------------------
# Traefik Rate Limiting Middleware Configuration
# Конфигурация middleware для rate limiting в Traefik
# -----------------------------------------------------------------------------

# Traefik uses middleware for rate limiting
# Traefik использует middleware для rate limiting
http:
  middlewares:
    # Global rate limiting middleware
    # Глобальная middleware для rate limiting
    rate-limit-global:
      rateLimit:
        # Average rate: Средняя скорость
        average: 100  # 100 запросов в секунду / requests per second

        # Burst: Максимальный всплеск
        burst: 200    # 200 запросов одновременно / 200 requests simultaneously

        # Period: Период для подсчета средней скорости
        period: 1s    # 1 секунда / 1 second

    # Strict rate limiting for expensive endpoints
    # Строгое rate limiting для "дорогих" endpoints
    rate-limit-strict:
      rateLimit:
        average: 10   # 10 req/s для ML processing / для ML обработки
        burst: 20
        period: 1s

    # Per-IP rate limiting (using expression)
    # Rate limiting по IP (используя выражение)
    rate-limit-per-ip:
      rateLimit:
        average: 100
        burst: 200
        period: 1s
        sourceCriterion:
          requestHeaderName: X-Real-IP  # Или X-Forwarded-For

# =============================================================================
# Per-Route Rate Limits (Специфичные для конкретных endpoints)
# Пермаршрутные ограничения частоты запросов
# =============================================================================
#
# Различные endpoints могут требовать разные лимиты
# Different endpoints may require different limits

# -----------------------------------------------------------------------------
# High-traffic endpoints (GET requests, read-only)
# High-traffic endpoints (GET запросы, только чтение)
# -----------------------------------------------------------------------------
#
# Эти endpoints обрабатывают много запросов, но они "легкие" (no heavy processing)
# These endpoints handle many requests but are "light" (no heavy processing)

# GET /api/resumes - List resumes (список резюме)
# GET /api/candidates - List candidates (список кандидатов)
# GET /api/vacancies - List vacancies (список вакансий)

# Kong plugin configuration for high-traffic routes
# Конфигурация плагина Kong для high-traffic маршрутов
routes_high_traffic:
  - name: resumes_list_rate_limit
    route: resume_processing_routes
    methods:
      - GET
    plugins:
      - name: rate-limiting
        enabled: true
        config:
          second: 200      # Higher limit for GET / Более высокий лимит для GET
          minute: 10000
          hour: 50000
          policy: redis
          redis_host: redis
          redis_port: 6379
          redis_database: 1
          limit_by: ip

  - name: candidates_list_rate_limit
    route: candidate_routes
    methods:
      - GET
    plugins:
      - name: rate-limiting
        enabled: true
        config:
          second: 200
          minute: 10000
          policy: redis

  - name: vacancies_list_rate_limit
    route: vacancy_routes
    methods:
      - GET
    plugins:
      - name: rate-limiting
        enabled: true
        config:
          second: 200
          minute: 10000
          policy: redis

# -----------------------------------------------------------------------------
# Heavy processing endpoints (ML operations, report generation)
# Endpoints с тяжелой обработкой (ML операции, генерация отчетов)
# -----------------------------------------------------------------------------
#
# Эти endpoints требуют больших ресурсов сервера
# These endpoints require significant server resources

# POST /api/resumes/upload - File upload (загрузка файлов)
# POST /api/analysis - Resume analysis (анализ резюме)
# POST /api/matching/compare - Candidate matching (сопоставление кандидатов)
# POST /api/ats/simulate - ATS simulation with LLM (ATS симуляция с LLM)
# POST /api/reports - Report generation (генерация отчетов)

# Kong plugin configuration for heavy processing routes
# Конфигурация плагина Kong для маршрутов с тяжелой обработкой
routes_heavy_processing:
  - name: resume_upload_rate_limit
    route: resume_processing_routes
    methods:
      - POST
    paths:
      - /api/resumes/upload
    plugins:
      - name: rate-limiting
        enabled: true
        config:
          second: 5       # Very low limit for file uploads / Очень низкий лимит для загрузки
          minute: 100
          hour: 500
          policy: redis
          limit_by: ip

  - name: analysis_rate_limit
    route: resume_processing_routes
    methods:
      - POST
    paths:
      - /api/analysis
    plugins:
      - name: rate-limiting
        enabled: true
        config:
          second: 10      # ML processing is expensive / ML обработка "дорогая"
          minute: 200
          hour: 1000
          policy: redis
          limit_by: consumer  # Per-user limit / Лимит на пользователя

  - name: matching_rate_limit
    route: matching_routes
    methods:
      - POST
    plugins:
      - name: rate-limiting
        enabled: true
        config:
          second: 20
          minute: 500
          policy: redis
          limit_by: consumer

  - name: ats_simulation_rate_limit
    route: ats_simulation_routes
    methods:
      - POST
    plugins:
      - name: rate-limiting
        enabled: true
        config:
          second: 2       # LLM calls are very expensive / LLM вызовы очень "дорогие"
          minute: 50
          hour: 200
          policy: redis
          limit_by: consumer

  - name: report_generation_rate_limit
    route: analytics_routes
    methods:
      - POST
    paths:
      - /api/reports
    plugins:
      - name: rate-limiting
        enabled: true
        config:
          second: 1       # Report generation is heavy / Генерация отчетов "тяжелая"
          minute: 20
          hour: 100
          policy: redis
          limit_by: consumer

# =============================================================================
# CORS (Cross-Origin Resource Sharing) Configuration
# Конфигурация CORS (Совместное использование ресурсов между источниками)
# =============================================================================
#
# CORS позволяет frontend на другом домене делать запросы к API
# CORS allows frontend on a different domain to make API requests
#
# Frontend URLs: / URL фронтенда:
# - Development: http://localhost:5173 (Vite dev server)
# - Production: http://localhost:3000 (production build)
# - Future: https://app.agenthr.com (production domain)

# -----------------------------------------------------------------------------
# CORS Settings Reference (from backend/main.py)
# Справочные настройки CORS (из backend/main.py)
# -----------------------------------------------------------------------------
#
# Following the pattern from the backend FastAPI application:
# Следуя паттерну из бэкенд FastAPI приложения:
#
# allow_origins:
#   - http://localhost:5173
#   - http://localhost:3000
#
# allow_credentials: true
#
# allow_methods:
#   - GET
#   - POST
#   - PUT
#   - DELETE
#   - OPTIONS
#
# allow_headers:
#   - Content-Type
#   - Authorization
#   - X-Requested-With
#   - Accept
#   - Origin
#   - Access-Control-Request-Method
#   - Access-Control-Request-Headers

# -----------------------------------------------------------------------------
# Kong CORS Plugin Configuration
# Конфигурация плагина CORS для Kong
# -----------------------------------------------------------------------------

# CORS is already configured in kong.yml, here's the detailed config
# CORS уже настроен в kong.yml, здесь детальная конфигурация
plugins_cors:
  - name: cors
    enabled: true
    config:
      # Allowed origins (domains that can access the API)
      # Разрешенные источники (домены, которые могут обращаться к API)
      origins:
        - http://localhost:5173   # Vite dev server / Dev сервер Vite
        - http://localhost:3000   # Production build / Production сборка
        # - https://app.agenthr.com  # Production domain (uncomment for production) / Production домен

      # Allow credentials (cookies, authorization headers)
      # Разрешить credentials (cookies, заголовки авторизации)
      credentials: true

      # Allowed HTTP methods
      # Разрешенные HTTP методы
      methods:
        - GET       # Получение данных / Fetch data
        - POST      # Создание данных / Create data
        - PUT       # Обновление данных / Update data
        - DELETE    # Удаление данных / Delete data
        - PATCH     # Частичное обновление / Partial update
        - OPTIONS   # Preflight requests / Preflight запросы

      # Allowed HTTP headers (that client can send)
      # Разрешенные HTTP заголовки (которые клиент может отправлять)
      headers:
        - Accept                    # Accept header / Заголовок Accept
        - Accept-Version            # API version / Версия API
        - Content-Length            # Content length / Длина контента
        - Content-MD5               # Content MD5 hash / MD5 хеш контента
        - Content-Type              # Content type (application/json, etc.) / Тип контента
        - Date                      # Request date / Дата запроса
        - Authorization             # JWT token / JWT токен
        - X-Request-ID              # Request correlation ID / ID корреляции запроса
        - X-API-Key                 # API key (if used) / API ключ (если используется)
        - X-Requested-With          # XMLHttpRequest indicator / Индикатор XMLHttpRequest
        - Origin                    # Request origin / Источник запроса
        - Access-Control-Request-Method   # Preflight method / Preflight метод
        - Access-Control-Request-Headers  # Preflight headers / Preflight заголовки

      # Exposed headers (headers that client can read from response)
      # Раскрытые заголовки (заголовки, которые клиент может читать из ответа)
      exposed_headers:
        - X-Request-ID              # Correlation ID / ID корреляции
        - X-RateLimit-Limit         # Rate limit info / Информация о rate limit
        - X-RateLimit-Remaining     # Remaining requests / Оставшиеся запросы
        - X-RateLimit-Reset         # Limit reset time / Время сброса лимита

      # Max age for preflight requests (cache time)
      # Максимальный возраст для preflight запросов (время кэша)
      max_age: 3600  # 1 hour / 1 час (preflight кэшируется на 1 час)

      # Preflight continuation: Send preflight request to upstream service
      # Preflight continuation: Отправлять preflight запрос в бэкенд сервис
      preflight_continue: false  # Handle preflight at gateway / Обрабатывать preflight на gateway

# -----------------------------------------------------------------------------
# Traefik CORS Middleware Configuration
# Конфигурация middleware CORS для Traefik
# -----------------------------------------------------------------------------

# Traefik uses middleware for CORS
# Traefik использует middleware для CORS
http:
  middlewares:
    cors-global:
      headers:
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        accessControlAllowHeaders:
          - Accept
          - Accept-Version
          - Content-Length
          - Content-MD5
          - Content-Type
          - Date
          - Authorization
          - X-Request-ID
          - X-API-Key
          - X-Requested-With
          - Origin
          - Access-Control-Request-Method
          - Access-Control-Request-Headers
        accessControlExposeHeaders:
          - X-Request-ID
          - X-RateLimit-Limit
          - X-RateLimit-Remaining
          - X-RateLimit-Reset
        accessControlAllowCredentials: true
        accessControlMaxAge: 3600
        accessControlAllowOriginList:
          - http://localhost:5173
          - http://localhost:3000
          # - https://app.agenthr.com

# -----------------------------------------------------------------------------
# NGINX-style CORS configuration (reference)
# Конфигурация CORS в стиле NGINX (справочная)
# -----------------------------------------------------------------------------

# CORS headers are added to responses
# CORS заголовки добавляются к ответам
location /api/ {
    # Preflight requests (OPTIONS method)
    # Preflight запросы (метод OPTIONS)
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin http://localhost:5173 always;
        add_header Access-Control-Allow-Origin http://localhost:3000 always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Request-ID" always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Max-Age 3600 always;
        add_header Content-Length 0;
        add_header Content-Type text/plain;
        return 204;
    }

    # Regular requests
    # Обычные запросы
    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Request-ID" always;
    add_header Access-Control-Allow-Credentials true always;
    add_header Access-Control-Expose-Headers "X-Request-ID, X-RateLimit-Limit, X-RateLimit-Remaining" always;

    # Rate limit headers
    # Заголовки rate limit
    add_header X-RateLimit-Limit "100" always;
    add_header X-RateLimit-Remaining "95" always;
    add_header X-RateLimit-Reset "1641234567" always;

    proxy_pass http://backend_service;
}

# =============================================================================
# Per-User Rate Limiting (after JWT authentication)
# Ограничение частоты запросов на пользователя (после JWT аутентификации)
# =============================================================================
#
# После аутентификации JWT можно ограничивать запросы на конкретного пользователя
# After JWT authentication, requests can be limited per specific user
#
# Идентификатор пользователя берется из JWT claim 'sub' (subject)
# User identifier is taken from JWT claim 'sub' (subject)

# Kong plugin configuration for per-user rate limiting
# Конфигурация плагина Kong для rate limiting на пользователя
plugins_per_user:
  - name: rate-limiting
    enabled: true
    config:
      # Лимиты на authenticated пользователя
      # Limits per authenticated user
      second: 50       # 50 req/s per user / на пользователя
      minute: 2000     # 2,000 req/min per user / на пользователя
      hour: 10000      # 10,000 req/hour per user / на пользователя

      # Использовать consumer ID (извлекается из JWT)
      # Use consumer ID (extracted from JWT)
      limit_by: consumer

      policy: redis
      redis_host: redis
      redis_port: 6379
      redis_database: 3  # Отдельная база для per-user limits / Separate database for per-user limits

# =============================================================================
# Rate Limiting Response Headers
# Заголовки ответов для rate limiting
# =============================================================================
#
# API Gateway должен информировать клиента о текущих лимитах
# API Gateway should inform client about current limits
#
# Стандартные заголовки (Standard headers):
# - X-RateLimit-Limit: Максимальное количество запросов / Maximum number of requests
# - X-RateLimit-Remaining: Оставшиеся запросы / Remaining requests
# - X-RateLimit-Reset: Время сброса лимита (Unix timestamp) / Limit reset time
# - Retry-After: Сколько секунд ждать перед повторным запросом / Seconds to wait before retry

# Kong automatically adds these headers when hide_client_headers: false
# Kong автоматически добавляет эти заголовки когда hide_client_headers: false

# =============================================================================
# Testing Rate Limiting
# Тестирование rate limiting
# =============================================================================
#
# Примеры команд для тестирования rate limiting
# Example commands to test rate limiting

# 1. Test basic rate limiting (should work first 100 times)
# Тест базового rate limiting (должно работать первые 100 раз)
# for i in {1..150}; do curl -s http://localhost:8888/api/resumes | grep -q "200" && echo "Request $i: OK" || echo "Request $i: FAILED"; done

# 2. Test with response time measurement
# Тест с измерением времени ответа
# time for i in {1..200}; do curl -s http://localhost:8888/api/resumes > /dev/null; done

# 3. Test per-user rate limiting (with JWT token)
# Тест rate limiting на пользователя (с JWT токеном)
# for i in {1..100}; do curl -s -H "Authorization: Bearer <JWT_TOKEN>" http://localhost:8888/api/matching | grep -q "200" && echo "Request $i: OK" || echo "Request $i: RATE LIMITED"; done

# 4. Check rate limit headers in response
# Проверить заголовки rate limit в ответе
# curl -I http://localhost:8888/api/resumes
# Expected output / Ожидаемый вывод:
# X-RateLimit-Limit: 100
# X-RateLimit-Remaining: 95
# X-RateLimit-Reset: 1641234567

# 5. Test 429 response (Too Many Requests)
# Тест ответа 429 (Too Many Requests)
# curl -i http://localhost:8888/api/resumes
# Expected after limit exceeded / Ожидается после превышения лимита:
# HTTP/1.1 429 Too Many Requests
# {
#   "error": "Rate limit exceeded",
#   "error_ru": "Превышен лимит запросов",
#   "message": "Too many requests. Please try again later.",
#   "retry_after": 60
# }

# =============================================================================
# Testing CORS
# Тестирование CORS
# =============================================================================
#
# Примеры команд для тестирования CORS
# Example commands to test CORS

# 1. Preflight OPTIONS request
# Preflight OPTIONS запрос
# curl -i -X OPTIONS http://localhost:8888/api/resumes \
#   -H "Origin: http://localhost:5173" \
#   -H "Access-Control-Request-Method: POST" \
#   -H "Access-Control-Request-Headers: Content-Type, Authorization"
#
# Expected response / Ожидаемый ответ:
# Access-Control-Allow-Origin: http://localhost:5173
# Access-Control-Allow-Methods: GET, POST, PUT, DELETE, PATCH, OPTIONS
# Access-Control-Allow-Headers: Content-Type, Authorization
# Access-Control-Allow-Credentials: true
# Access-Control-Max-Age: 3600

