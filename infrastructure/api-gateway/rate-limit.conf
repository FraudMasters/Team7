# =============================================================================
# Rate Limiting Best Practices
# Лучшие практики для rate limiting
# =============================================================================
#
# 1. Start with conservative limits and increase based on monitoring
#    Начинайте с консервативных лимитов и увеличивайте на основе мониторинга
#
# 2. Use Redis for distributed environments
#    Используйте Redis для распределенных сред
#
# 3. Set fault_tolerant: true to avoid blocking requests if Redis is down
#    Установите fault_tolerant: true чтобы избежать блокировки запросов при падении Redis
#
# 4. Monitor rate limit metrics (hits, misses, rejections)
#    Мониторьте метрики rate limit (попадания, промахи, отклонения)
#
# 5. Provide clear error messages with retry_after
#    Предоставляйте четкие сообщения об ошибках с retry_after
#
# 6. Consider implementing exponential backoff on client side
#    Рассмотрите реализацию exponential backoff на клиенте
#
# 7. Differentiate between authenticated and anonymous users
#    Различайте аутентифицированных и анонимных пользователей
#
# 8. Use per-user limits for expensive operations (ML, LLM calls)
#    Используйте лимиты на пользователя для дорогих операций (ML, LLM вызовы)
#
# 9. Implement gradual limits (warn before hard blocking)
#    Реализуйте постепенные лимиты (предупреждайте перед жесткой блокировкой)
#
# 10. Log rate limit violations for security monitoring
#     Логируйте нарушения rate limit для мониторинга безопасности

# =============================================================================
# CORS Best Practices
# Лучшие практики для CORS
# =============================================================================
#
# 1. Only allow specific origins (avoid wildcard for production)
#    Разрешайте только конкретные источники (избегайте wildcard для production)
#
# 2. Use credentials: true only when needed (cookies, auth headers)
#    Используйте credentials: true только когда нужно (cookies, auth headers)
#
# 3. Cache preflight responses (max_age) to reduce OPTIONS requests
#    Кэшируйте preflight ответы (max_age) для уменьшения OPTIONS запросов
#
# 4. Only expose necessary headers in Access-Control-Expose-Headers
#    Раскрывайте только необходимые заголовки в Access-Control-Expose-Headers
#
# 5. Validate Origin header on server side (don't trust client)
#    Проверяйте заголовок Origin на сервере (не доверяйте клиенту)
#
# 6. Use Vary: Origin header for caching purposes
#    Используйте заголовок Vary: Origin для целей кэширования
#
# 7. Consider using CORS proxy for development only
#    Рассмотрите использование CORS прокси только для разработки
#
# 8. Test CORS from browser (curl doesn't fully simulate browser behavior)
#    Тестируйте CORS из браузера (curl не полностью имитирует поведение браузера)

# =============================================================================
# Deployment Notes
# Заметки по развертыванию
# =============================================================================
#
# 1. Configure Redis persistence to survive restarts
#    Настройте персистентность Redis для переживания перезагрузок
#
# 2. Use environment variables for rate limit values (easy tuning)
#    Используйте переменные окружения для значений rate limit (легкая настройка)
#
# 3. Set up alerts for high rate limit rejection rates
#    Настройте алерты для высокого процента отклонений rate limit
#
# 4. Consider implementing API keys for heavy users
#    Рассмотрите внедрение API ключей для активных пользователей
#
# 5. Use separate Redis databases for different limit types
#    Используйте отдельные базы Redis для разных типов лимитов
#
# 6. In production, use HTTPS for all API endpoints
#    В production используйте HTTPS для всех API endpoints
#
# 7. Monitor Redis memory usage (rate limit data can grow large)
#    Мониторьте использование памяти Redis (данные rate limit могут быть большими)
#
# 8. Test failover scenarios (Redis down, network partition)
#    Тестируйте сценарии отказов (Redis недоступен, разрыв сети)

