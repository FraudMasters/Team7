[tool.black]
# Black configuration for resume analysis system
# See https://black.readthedocs.io/en/stable/usage_and_configuration.html

# Target Python versions
target-version = ['py39', 'py310', 'py311']

# Line length (matches default, but explicit for clarity)
line-length = 100

# Exclude directories and files
exclude = '''
/(
    \.git
  | \.tox
  | \.eggs
  | \.eggs-info
  | \.pytest_cache
  | __pycache__
  | build
  | dist
  | venv
  | \.venv
)/
'''

[tool.isort]
# isort configuration (compatible with black)
# See https://pycqa.github.io/isort/

# Profile to ensure compatibility with black
profile = "black"

# Line length (should match black)
line_length = 100

# Multi-line output style (compatible with black)
multi_line_output = 3

# Force grid wrap for multi-line imports
force_grid_wrap = 0

# Use parentheses for imports
use_parentheses = true

# Ensure all imports are on separate lines if they fit
ensure_newline_before_comments = true

[tool.flake8]
# Flake8 configuration for resume analysis system
# See https://flake8.pycqa.org/en/latest/user/configuration.html

# Maximum line length (should match black)
max-line-length = 100

# Error codes to ignore
ignore = [
    'E203',  # Whitespace before ':' (conflicts with black)
    'E266',  # Too many '#' for block comment
    'E501',  # Line too long (handled by black)
    'W503',  # Line break before binary operator (conflicts with black)
]

# Exclude directories and files
exclude = [
    '.git',
    '__pycache__',
    '.pytest_cache',
    '.tox',
    'build',
    'dist',
    '*.egg-info',
    'venv',
    '.venv',
]

# Max complexity for McCabe complexity checker
max-complexity = 10

[tool.mypy]
# MyPy configuration for resume analysis system
# See https://mypy.readthedocs.io/en/stable/config_file.html

# Python version to target
python_version = "3.9"

# Warn about missing type annotations
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Start gradual, can enable later
disallow_incomplete_defs = false  # Start gradual, can enable later

# Check untyped function definitions
check_untyped_defs = true

# Warn about unused ignores
warn_unused_ignores = true

# Warn about no return
warn_no_return = true

# Warn about unreachable code
warn_unreachable = true

# Show error codes
show_error_codes = true

# Show column numbers
show_column_numbers = true

# Exclude directories and files
exclude = [
    '.git',
    '__pycache__',
    '.pytest_cache',
    '.tox',
    'build',
    'dist',
    '*.egg-info',
    'venv',
    '.venv',
]

[[tool.mypy.overrides]]
# Specific overrides for external packages without type stubs
module = [
    'pytest.*',
]
ignore_missing_imports = true

[tool.pytest.ini_options]
# Pytest configuration (alternative to pytest.ini)
# This section is provided for reference - actual config is in pytest.ini

# Test discovery patterns
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

# Test paths
testpaths = ["tests"]

# Output options
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
]

# Markers
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

# Ignore paths
norecursedir = [
    ".git",
    ".tox",
    "dist",
    "build",
    "*.egg",
    "venv",
]

[tool.coverage.run]
# Coverage configuration (when using pytest-cov)
# See https://coverage.readthedocs.io/

# Branch coverage
branch = true

# Source directories to measure
source = ["."]

# Omit directories/files from coverage
omit = [
    "tests/*",
    "*/test_*.py",
    "__pycache__/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
# Coverage report options

# Show missing lines
show_missing = true

# Skip covered files
skip_covered = false

# Precision for percentage coverage
precision = 2
