# AgentHR Backend - Python Tooling Configuration
# https://packaging.python.org/en/latest/guides/modernize-setup-py-project/

[project]
name = "agenthr-backend"
version = "0.1.0"
description = "AI-powered resume analysis and candidate ranking system"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "AgentHR Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# Black configuration - Code formatter
# https://black.readthedocs.io/en/stable/usage_and_configuration.html
[tool.black]
line-length = 100
target-version = ["py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    # Defaults
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
    # Project specific
  | vendor
  | third_party
  | \.pb\.go
)/
'''

# Isort configuration - Import sorting
# https://pycqa.github.io/isort/docs/configuration/config_files.html
[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["backend", "analyzers", "api"]
known_third_party = [
    "fastapi",
    "pydantic",
    "sqlalchemy",
    "alembic",
    "pytest",
    "spacy",
    "torch",
    "transformers",
    "sklearn",
    "numpy",
    "pandas",
]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
skip = [
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "_build",
    "buck-out",
    "build",
    "dist",
    "vendor",
    "third_party",
]
skip_glob = ["**/alembic/versions/*.py"]

# Mypy configuration - Static type checking
# https://mypy.readthedocs.io/en/stable/config_file.html
[tool.mypy]
# Python version to target
python_version = "3.11"

# Basic options
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Gradually enable this
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_calls = false
disallow_any_generics = false

# Error reporting
show_error_context = true
show_column_numbers = true
show_error_codes = true
pretty = true

# Warnings
warn_unused_ignores = false
warn_redundant_casts = true
warn_no_return = true

# Platform configuration
strict_optional = true

# Import discovery
namespace_packages = true
explicit_package_bases = false

# Misc
strict_equality = true

# Files to exclude
exclude = [
    'build/',
    'dist/',
    '*.egg-info/',
    '.git/',
    '.hg/',
    '.mypy_cache/',
    '.tox/',
    '.venv/',
    'venv/',
    'vendor/',
    'third_party/',
]

# Per-module overrides for specific patterns
[[tool.mypy.overrides]]
module = [
    "spacy.*",
    "torch.*",
    "transformers.*",
    "sklearn.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "analyzers.*",  # ML/NLP code has more complex typing
]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = [
    "tests.*",
]
disallow_untyped_defs = false
disallow_untyped_calls = true

# Coverage configuration
# https://coverage.readthedocs.io/en/latest/config.html
[tool.coverage.run]
source = ["analyzers", "api"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
    "*/dist/*",
    "*/build/*",
    "*/alembic/versions/*",
]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
sort = "Cover"
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\b.*:",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

# Pytest configuration (duplicate of pytest.ini for tool consistency)
# https://docs.pytest.org/en/stable/reference/reference.html#configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
    "--cov=analyzers",
    "--cov=api",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=80",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
norecursedir = [".git", ".tox", "dist", "build", "*.egg", "venv"]

# Ruff configuration (minimal - main config is in ruff.toml)
# https://docs.astral.sh/ruff/configuration/
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "TD003",  # Missing issue link on TODO
    "TD002",  # Missing author in TODO
]

[tool.ruff.lint.isort]
known-first-party = ["backend", "analyzers", "api"]
known-third-party = [
    "fastapi",
    "pydantic",
    "sqlalchemy",
    "alembic",
    "pytest",
    "spacy",
    "torch",
    "transformers",
    "sklearn",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
