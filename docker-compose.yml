services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: resume_analysis_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-resume_analysis}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - resume_network

  # Redis (for Celery broker and result backend)
  redis:
    image: redis:7-alpine
    container_name: resume_analysis_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - resume_network

  # PostgreSQL Exporter (Prometheus metrics for PostgreSQL)
  postgres_exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: resume_analysis_postgres_exporter
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-resume_analysis}?sslmode=disable
    ports:
      - "9187:9187"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - resume_network

  # Backend API (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resume_analysis_backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-resume_analysis}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      MODELS_CACHE_PATH: /app/models_cache
      PYTHONPATH: /app:/app/services
      # Hugging Face optimizations
      TRANSFORMERS_CACHE: /app/models_cache/hub
      HF_HOME: /app/models_cache
      PYTORCH_ENABLE_MPS_FALLBACK: 1
      # Logging to Loki
      LOKI_URL: http://loki:3100
      # Backup Configuration
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_DIR: /app/data/backups
      BACKUP_S3_ENABLED: ${BACKUP_S3_ENABLED:-false}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
      BACKUP_NOTIFICATION_EMAIL: ${BACKUP_NOTIFICATION_EMAIL:-}
      # PostgreSQL connection for pg_dump
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATABASE: ${POSTGRES_DB:-resume_analysis}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./services:/app/services
      - ./testdata:/app/testdata:ro
      - backend_models:/app/models_cache
      - backend_logs:/app/logs
      - backend_backups:/app/data/backups
      - backend_uploads:/app/data/uploads
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - resume_network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Celery Worker (for async processing)
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resume_analysis_celery_worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-resume_analysis}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      MODELS_CACHE_PATH: /app/models_cache
      PYTHONPATH: /app:/app/services
      # Hugging Face optimizations
      TRANSFORMERS_CACHE: /app/models_cache/hub
      HF_HOME: /app/models_cache
      PYTORCH_ENABLE_MPS_FALLBACK: 1
      # Logging to Loki
      LOKI_URL: http://loki:3100
      # Backup Configuration
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_DIR: /app/data/backups
      BACKUP_S3_ENABLED: ${BACKUP_S3_ENABLED:-false}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
      BACKUP_NOTIFICATION_EMAIL: ${BACKUP_NOTIFICATION_EMAIL:-}
      # PostgreSQL connection for pg_dump
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATABASE: ${POSTGRES_DB:-resume_analysis}
    volumes:
      - ./backend:/app
      - ./services:/app/services
      - backend_models:/app/models_cache
      - backend_logs:/app/logs
      - backend_backups:/app/data/backups
      - backend_uploads:/app/data/uploads
    deploy:
      resources:
        limits:
          cpus: '6.0'
          memory: 12G
        reservations:
          cpus: '3.0'
          memory: 6G
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - resume_network
    command: celery -A celery_app.celery_app worker --loglevel=info --concurrency=4 --prefetch-multiplier=2 --queues=celery,analysis,learning,reporting

  # Celery Beat (for scheduled tasks like daily backups)
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resume_analysis_celery_beat
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-resume_analysis}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      MODELS_CACHE_PATH: /app/models_cache
      PYTHONPATH: /app:/app/services
      # Logging to Loki
      LOKI_URL: http://loki:3100
      # Backup Configuration
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_DIR: /app/data/backups
      BACKUP_S3_ENABLED: ${BACKUP_S3_ENABLED:-false}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
      BACKUP_NOTIFICATION_EMAIL: ${BACKUP_NOTIFICATION_EMAIL:-}
      # PostgreSQL connection for pg_dump
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATABASE: ${POSTGRES_DB:-resume_analysis}
    volumes:
      - ./backend:/app
      - ./services:/app/services
      - backend_backups:/app/data/backups
      - celerybeat_data:/app/celerybeat
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - resume_network
    command: celery -A celery_app.celery_app beat --loglevel=info

  # Celery Exporter (Prometheus metrics for Celery)
  celery_exporter:
    image: quay.io/prometheuscommunity/celery-exporter:v0.0.16
    container_name: resume_analysis_celery_exporter
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_EXPORTER_BROKER_URL: redis://redis:6379/0
      CELERY_EXPORTER_ENABLE_BROKER_OPTIONAL: "true"
      CELERY_EXPORTER_BROKER_TRANSPORT: redis
      CELERY_EXPORTER_BROKER_TRANSPORT_OPTIONS: "{'visibility_timeout': 3600}"
    ports:
      - "9540:9540"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - resume_network

  # cAdvisor (Container metrics for Docker)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: resume_analysis_cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - resume_network

  # Frontend (React + Vite) - Development mode with Vite dev server
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
      args:
        VITE_API_URL: "http://backend:8000"
    container_name: resume_analysis_frontend
    ports:
      - "${FRONTEND_PORT:-3000}:5173"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://backend:8000
    networks:
      - resume_network

  # Grafana (Visualization & Monitoring)
  grafana:
    image: grafana/grafana:11.1.0
    container_name: resume_analysis_grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: "grafana-piechart-panel,grafana-worldmap-panel"
      GF_SERVER_ROOT_URL: "http://localhost:3001"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_TELEMETRY_ENABLED: "false"
      # SMTP Configuration (Email Alerts)
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: ${GRAFANA_SMTP_HOST:-smtp.gmail.com:587}
      GF_SMTP_USER: ${GRAFANA_SMTP_USER:-}
      GF_SMTP_PASSWORD: ${GRAFANA_SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${GRAFANA_SMTP_FROM_ADDRESS:-grafana@localhost}
      GF_SMTP_FROM_NAME: "Grafana Alerts"
      GF_SMTP_STARTTLS_POLICY: ${GRAFANA_SMTP_STARTTLS_POLICY:-OpportunisticStartTLS}
      # Alert Configuration
      ALERT_EMAIL_ADDRESS: ${ALERT_EMAIL_ADDRESS:-alerts@example.com}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_USERNAME: ${ALERT_WEBHOOK_USERNAME:-}
      ALERT_WEBHOOK_PASSWORD: ${ALERT_WEBHOOK_PASSWORD:-}
      ALERT_WEBHOOK_BEARER_TOKEN: ${ALERT_WEBHOOK_BEARER_TOKEN:-}
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - resume_network

  # Loki (Log aggregation)
  loki:
    image: grafana/loki:3.1.1
    container_name: resume_analysis_loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
      - "9080:9080"  # Prometheus metrics
    volumes:
      - ./monitoring/loki/config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - resume_network

  # Promtail (Log collector for containers)
  promtail:
    image: grafana/promtail:3.1.1
    container_name: resume_analysis_promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - backend_logs:/var/log/backend:ro
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - resume_network
    depends_on:
      - loki

  # Prometheus (Metrics collection)
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: resume_analysis_prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/grafana/provisioning/alerts/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    networks:
      - resume_network

volumes:
  postgres_data:
  redis_data:
  backend_models:
  backend_logs:
  backend_backups:
  backend_uploads:
  celerybeat_data:
  grafana_data:
  loki_data:
  prometheus_data:

networks:
  resume_network:
    driver: bridge
