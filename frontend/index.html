<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Tags -->
    <meta name="description" content="AI-powered resume analysis platform with intelligent job matching. Upload your resume and get instant feedback on skills, experience, and job fit." />
    <meta name="keywords" content="resume analysis, job matching, AI recruitment, skills assessment, candidate screening" />
    <meta name="author" content="TEAM7" />
    <meta name="theme-color" content="#1976d2" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Resume Analysis Platform" />
    <meta property="og:description" content="AI-powered resume analysis with intelligent job matching" />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Resume Analysis Platform" />
    <meta name="twitter:description" content="AI-powered resume analysis with intelligent job matching" />

    <!-- Preconnect to external origins for faster connection setup -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="http://localhost:8000" crossorigin />

    <!-- DNS prefetch for potential future requests -->
    <link rel="dns-prefetch" href="http://localhost:8000" />

    <!-- Prefetch critical resources -->
    <link rel="prefetch" href="/fonts/Roboto.woff2" />

    <!-- Variable Fonts - 2026 Design System -->
    <!-- Inter Variable: Weight 100-900, Width 25-151, Slant -10-0 -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Space+Grotesk:wght@300..700&display=swap" />
    <link rel="preload" as="font" href="https://fonts.gstatic.com/s/inter/v13/UcCO3FwrK3iLTeHuS_fvQtMwCp50KnMw2boKoduKmMEVuLyfAZ9hjp-Ek-_EeA.woff2" type="font/woff2" crossorigin />
    <link rel="preload" as="font" href="https://fonts.gstatic.com/s/spacegrotesk/v15/V8mDoQDjQSkFtoMM3T6r8E7nPydR38A.woff2" type="font/woff2" crossorigin />

    <!-- Page title -->
    <title>Resume Analysis Platform - AI-Powered Job Matching</title>

    <!-- Inline critical CSS (minimal, can be expanded) -->
    <style>
      /* Prevent flash of unstyled content */
      #root {
        min-height: 100vh;
      }
      /* Loading indicator styles */
      .initial-loading {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Initial loading state shown before React hydrates -->
      <div class="initial-loading" aria-busy="true" aria-live="polite">
        Loading...
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
