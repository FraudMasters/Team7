apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agenthr.fullname" . }}-secrets
  labels:
    {{- include "agenthr.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Database credentials
  database-url: {{ include "agenthr.databaseUrl" . | quote }}
  postgres-user: {{ .Values.postgresql.auth.username | default "postgres" | quote }}
  postgres-password: {{ .Values.postgresql.auth.password | default "postgres" | quote }}
  postgres-db: {{ .Values.postgresql.auth.database | default "resume_analysis" | quote }}

  # Redis URL
  redis-url: {{ include "agenthr.redisUrl" . | quote }}

  # Optional API keys
  {{- if .Values.secrets.openaiApiKey }}
  openai-api-key: {{ .Values.secrets.openaiApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.anthropicApiKey }}
  anthropic-api-key: {{ .Values.secrets.anthropicApiKey | quote }}
  {{- end }}

  # Neo4j password (if enabled)
  {{- if .Values.config.neo4j.enabled }}
  neo4j-password: {{ .Values.config.neo4j.password | default "graphiti_password" | quote }}
  {{- end }}

  # Backup S3 configuration (if enabled)
  {{- if .Values.secrets.backupS3Bucket }}
  backup-s3-bucket: {{ .Values.secrets.backupS3Bucket | quote }}
  {{- end }}
  {{- if .Values.secrets.backupS3Endpoint }}
  backup-s3-endpoint: {{ .Values.secrets.backupS3Endpoint | quote }}
  {{- end }}
  {{- if .Values.secrets.backupS3AccessKey }}
  backup-s3-access-key: {{ .Values.secrets.backupS3AccessKey | quote }}
  {{- end }}
  {{- if .Values.secrets.backupS3SecretKey }}
  backup-s3-secret-key: {{ .Values.secrets.backupS3SecretKey | quote }}
  {{- end }}
  {{- if .Values.secrets.backupS3Region }}
  backup-s3-region: {{ .Values.secrets.backupS3Region | quote }}
  {{- end }}

  # Alert notification configuration
  {{- if .Values.secrets.alertEmail }}
  alert-email: {{ .Values.secrets.alertEmail | quote }}
  {{- end }}
  {{- if .Values.secrets.alertWebhookUrl }}
  alert-webhook-url: {{ .Values.secrets.alertWebhookUrl | quote }}
  {{- end }}
