apiVersion: v2
name: agenthr
description: AgentHR - AI-powered resume analysis and HR automation platform
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - hr
  - resume
  - ai
  - nlp
  - recruitment
  - analytics
home: https://github.com/yourusername/agenthr
sources:
  - https://github.com/yourusername/agenthr
maintainers:
  - name: AgentHR Team
    email: team@agenthr.example.com

dependencies:
  - name: postgresql
    version: "12.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: "17.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
