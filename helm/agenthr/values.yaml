# Default values for agenthr
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Global settings
global:
  storageClass: ""

# Image registry and pull policy
image:
  registry: docker.io
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Backend API service configuration
backend:
  enabled: true
  replicaCount: 1
  image:
    repository: agenthr/backend
    pullPolicy: IfNotPresent
    tag: "latest"

  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000

  resources:
    limits:
      cpu: 4000m
      memory: 8Gi
    requests:
      cpu: 2000m
      memory: 4Gi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

  livenessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 3

# Frontend service configuration
frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: agenthr/frontend
    pullPolicy: IfNotPresent
    tag: "latest"

  service:
    type: ClusterIP
    port: 5173
    targetPort: 5173

  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80

# Celery worker configuration
celeryWorker:
  enabled: true
  replicaCount: 1
  image:
    repository: agenthr/backend
    pullPolicy: IfNotPresent
    tag: "latest"

  resources:
    limits:
      cpu: 6000m
      memory: 12Gi
    requests:
      cpu: 3000m
      memory: 6Gi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

  # Celery configuration
  concurrency: 4
  prefetchMultiplier: 2
  queues: "celery,analysis,learning,reporting"

# Celery beat scheduler configuration
celeryBeat:
  enabled: true
  replicaCount: 1
  image:
    repository: agenthr/backend
    pullPolicy: IfNotPresent
    tag: "latest"

  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
    requests:
      cpu: 500m
      memory: 256Mi

# PostgreSQL database configuration (Bitnami chart)
postgresql:
  enabled: true
  auth:
    username: postgres
    password: postgres
    database: resume_analysis
    existingSecret: ""

  primary:
    persistence:
      enabled: true
      size: 10Gi

    resources:
      limits:
        cpu: 2000m
        memory: 2Gi
      requests:
        cpu: 1000m
        memory: 1Gi

# Redis configuration (Bitnami chart)
redis:
  enabled: true
  auth:
    enabled: false

  master:
    persistence:
      enabled: true
      size: 2Gi

    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 500m
        memory: 512Mi

# Persistent Volume Claims
persistence:
  # Backend models cache
  modelsCache:
    enabled: true
    size: 20Gi
    storageClass: ""
    accessMode: ReadWriteOnce

  # Backend uploads
  uploads:
    enabled: true
    size: 10Gi
    storageClass: ""
    accessMode: ReadWriteOnce

  # Backend backups
  backups:
    enabled: true
    size: 50Gi
    storageClass: ""
    accessMode: ReadWriteOnce

# Service Account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod Security Context
podSecurityContext:
  fsGroup: 1000

# Security Context
securityContext:
  runAsNonRoot: false
  runAsUser: 1000
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false

# Ingress configuration
ingress:
  enabled: false
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
  hosts:
    - host: agenthr.example.com
      paths:
        - path: /api
          pathType: Prefix
          backend:
            service:
              name: backend
              port: 8000
        - path: /
          pathType: Prefix
          backend:
            service:
              name: frontend
              port: 5173
  tls:
    - secretName: agenthr-tls
      hosts:
        - agenthr.example.com

# Application configuration
config:
  # Backend configuration
  backendPort: 8000
  backendHost: "0.0.0.0"

  # Frontend configuration
  frontendPort: 5173
  frontendHost: "0.0.0.0"

  # ML Models configuration
  modelsCachePath: /app/models_cache
  transformersCache: /app/models_cache/hub

  # Hugging Face optimizations
  pytorchEnableMpsFallback: "1"

  # Logging
  logLevel: INFO
  logFormat: json

  # CORS settings
  frontendUrl: ""

  # Application settings
  maxUploadSizeMb: 10
  allowedFileTypes: ".pdf,.docx"
  analysisTimeoutSeconds: 300

  # Backup configuration
  backupEnabled: "true"
  backupRetentionDays: "30"
  backupSchedule: "0 2 * * *"
  backupS3Enabled: "false"

  # Graphiti Configuration
  graphitiTelemetryEnabled: "false"
  semaphoreLimit: "10"

  # Neo4j Graph Database Configuration (optional)
  neo4j:
    enabled: false
    uri: "bolt://neo4j:7687"
    user: "neo4j"
    password: "graphiti_password"

# Secrets (use external secret management in production)
secrets:
  # Database credentials (if not using postgresql dependency)
  databaseUrl: ""
  postgresUser: ""
  postgresPassword: ""
  postgresDb: ""

  # Redis URL (if not using redis dependency)
  redisUrl: ""

  # API Keys (Optional - for LLM-based features)
  openaiApiKey: ""
  anthropicApiKey: ""

  # Backup S3 Configuration
  backupS3Bucket: ""
  backupS3Endpoint: ""
  backupS3AccessKey: ""
  backupS3SecretKey: ""
  backupS3Region: "us-east-1"

  # Alert Notification
  alertEmail: ""
  alertWebhookUrl: ""

  # Grafana SMTP Configuration
  grafanaSmtpHost: ""
  grafanaSmtpUser: ""
  grafanaSmtpPassword: ""

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity rules
affinity: {}

# Pod annotations
podAnnotations: {}

# Pod labels
podLabels: {}
