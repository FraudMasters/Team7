name: Security Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.11'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # Frontend dependency vulnerability scan
  frontend-dependency-scan:
    name: Frontend Dependency Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run npm audit
        working-directory: ./frontend
        run: |
          echo "### Frontend Dependency Vulnerability Scan 🔍" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          npm audit --json > npm-audit-report.json || true
          npm audit || true
        env:
          CI: true

      - name: Parse npm audit results
        working-directory: ./frontend
        run: |
          if [ -f npm-audit-report.json ]; then
            VULNERABILITIES=$(cat npm-audit-report.json | jq '.metadata.vulnerabilities')
            echo "Vulnerability Summary:" >> $GITHUB_STEP_SUMMARY
            echo "$VULNERABILITIES" >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-npm-audit-report
          path: frontend/npm-audit-report.json
          retention-days: 30

  # Backend dependency vulnerability scan
  backend-dependency-scan:
    name: Backend Dependency Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit safety

      - name: Run pip-audit
        working-directory: ./backend
        run: |
          echo "### Backend Dependency Vulnerability Scan 🔍" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          pip-audit --desc --format json --output pip-audit-report.json || true
          pip-audit --desc || true
        continue-on-error: true

      - name: Run safety check
        working-directory: ./backend
        run: |
          safety check --json --output safety-report.json || true
          safety check || true
        continue-on-error: true
        env:
          SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-pip-audit-report
          path: |
            backend/pip-audit-report.json
            backend/safety-report.json
          retention-days: 30

  # Python code security scanning
  python-security-scan:
    name: Python Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install security tools
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install bandit semgrep

      - name: Run Bandit security linter
        working-directory: ./backend
        run: |
          echo "### Bandit Security Scan 🔍" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          bandit -r analyzers/ api/ -f json -o bandit-report.json || true
          bandit -r analyzers/ api/ -f txt || true
        continue-on-error: true

      - name: Run Semgrep security scan
        working-directory: ./backend
        run: |
          semgrep --config=auto --json --output=semgrep-report.json || true
          semgrep --config=auto || true
        continue-on-error: true
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload security scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-security-scan-report
          path: |
            backend/bandit-report.json
            backend/semgrep-report.json
          retention-days: 30

  # Secrets scanning
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for secrets detection

      - name: Run TruffleHog secrets scanner
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified --json

      - name: Scan for common secret patterns
        run: |
          echo "### Secrets Scan Summary 🔍" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Scanning for potential secrets in code..." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check for common secret patterns (fails if found)
          if git grep -iE '(password|secret|api[_-]?key|token|private[_-]?key|access[_-]?key).*=.*["\x27][^"\x27]{8,}["\x27]' -- '*.py' '*.js' '*.ts' '*.tsx' '*.yml' '*.yaml'; then
            echo "⚠️ Warning: Potential hardcoded secrets found" >> $GITHUB_STEP_SUMMARY
            echo "Please review and move to environment variables" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No obvious hardcoded secrets detected" >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

  # SAST with CodeQL
  codeql-scan:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript', 'python']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          upload: true

  # Docker image security scanning (if Dockerfile exists)
  docker-security-scan:
    name: Docker Image Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image for scanning
        run: |
          if [ -f "Dockerfile" ]; then
            docker build -t agenthr:security-scan .
          elif [ -f "frontend/Dockerfile" ]; then
            docker build -t agenthr-frontend:security-scan ./frontend
          else
            echo "No Dockerfile found, skipping container scan"
            exit 0
          fi

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: agenthr:security-scan
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Generate Trivy summary
        if: always()
        run: |
          echo "### Docker Image Security Scan 🔍" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          trivy image --severity CRITICAL,HIGH agenthr:security-scan || true
        continue-on-error: true

  # Security scan summary with detailed findings
  security-summary:
    name: Security Summary Dashboard
    runs-on: ubuntu-latest
    needs: [
      frontend-dependency-scan,
      backend-dependency-scan,
      python-security-scan,
      secrets-scan,
      codeql-scan,
      docker-security-scan
    ]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all scan artifacts
        uses: actions/download-artifact@v4
        with:
          path: security-artifacts/

      - name: Parse security findings
        id: parse-security
        run: |
          # Initialize security summary string
          SECURITY_SUMMARY=""

          # Parse frontend npm audit
          NPM_AUDIT=$(find security-artifacts -name "npm-audit-report.json" -type f | head -1 || echo "")
          if [ -n "$NPM_AUDIT" ]; then
            VULNS=$(jq '.metadata.vulnerabilities' "$NPM_AUDIT" 2>/dev/null || echo '{}')
            CRITICAL=$(echo "$VULNS" | jq -r '.critical // 0')
            HIGH=$(echo "$VULNS" | jq -r '.high // 0')
            MODERATE=$(echo "$VULNS" | jq -r '.moderate // 0')
            LOW=$(echo "$VULNS" | jq -r '.low // 0')
            TOTAL=$((CRITICAL + HIGH + MODERATE + LOW))

            if [ "$TOTAL" -gt 0 ]; then
              SECURITY_SUMMARY+="| Frontend Dependencies | ⚠️ | ${CRITICAL} critical, ${HIGH} high, ${MODERATE} moderate, ${LOW} low |"$'\n'
            else
              SECURITY_SUMMARY+="| Frontend Dependencies | ✅ | 0 vulnerabilities |"$'\n'
            fi
          else
            SECURITY_SUMMARY+="| Frontend Dependencies | ⚠️ | Report not found |"$'\n'
          fi

          # Parse backend pip-audit
          PIP_AUDIT=$(find security-artifacts -name "pip-audit-report.json" -type f | head -1 || echo "")
          if [ -n "$PIP_AUDIT" ]; then
            VULN_COUNT=$(jq 'length' "$PIP_AUDIT" 2>/dev/null || echo "0")
            if [ "$VULN_COUNT" -gt 0 ]; then
              SECURITY_SUMMARY+="| Backend Dependencies | ⚠️ | ${VULN_COUNT} vulnerabilities |"$'\n'
            else
              SECURITY_SUMMARY+="| Backend Dependencies | ✅ | 0 vulnerabilities |"$'\n'
            fi
          else
            SECURITY_SUMMARY+="| Backend Dependencies | ⚠️ | Report not found |"$'\n'
          fi

          # Parse Bandit
          BANDIT_REPORT=$(find security-artifacts -name "bandit-report.json" -type f | head -1 || echo "")
          if [ -n "$BANDIT_REPORT" ]; then
            ERRORS=$(jq '.results | length' "$BANDIT_REPORT" 2>/dev/null || echo "0")
            if [ "$ERRORS" -gt 0 ]; then
              SECURITY_SUMMARY+="| Bandit Scan | ⚠️ | ${ERRORS} issues |"$'\n'
            else
              SECURITY_SUMMARY+="| Bandit Scan | ✅ | 0 issues |"$'\n'
            fi
          else
            SECURITY_SUMMARY+="| Bandit Scan | ⚠️ | Report not found |"$'\n'
          fi

          # Parse Semgrep
          SEMGREP_REPORT=$(find security-artifacts -name "semgrep-report.json" -type f | head -1 || echo "")
          if [ -n "$SEMGREP_REPORT" ]; then
            RESULTS=$(jq '.results | length' "$SEMGREP_REPORT" 2>/dev/null || echo "0")
            if [ "$RESULTS" -gt 0 ]; then
              SECURITY_SUMMARY+="| Semgrep Scan | ⚠️ | ${RESULTS} findings |"$'\n'
            else
              SECURITY_SUMMARY+="| Semgrep Scan | ✅ | 0 findings |"$'\n'
            fi
          else
            SECURITY_SUMMARY+="| Semgrep Scan | ⚠️ | Report not found |"$'\n'
          fi

          # Secrets scan status
          if [ "${{ needs.secrets-scan.result }}" = "failure" ]; then
            SECURITY_SUMMARY+="| Secrets Scan | ❌ | Secrets found! |"$'\n'
          else
            SECURITY_SUMMARY+="| Secrets Scan | ✅ | No secrets detected |"$'\n'
          fi

          # CodeQL
          SECURITY_SUMMARY+="| CodeQL Analysis | ${{ needs.codeql-scan.result == 'success' && '✅' || '⚠️' }} | ${{ needs.codeql-scan.result }} |"$'\n'

          # Docker scan
          SECURITY_SUMMARY+="| Docker Image Scan | ${{ needs.docker-security-scan.result == 'success' && '✅' || '⚠️' }} | ${{ needs.docker-security-scan.result }} |"$'\n'

          # Output as env var
          {
            echo 'security_summary<<EOF'
            echo "$SECURITY_SUMMARY"
            echo EOF
          } >> $GITHUB_OUTPUT

      - name: Generate comprehensive security summary
        env:
          GENERATED_TIME: ${{ github.event.head_commit.timestamp }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
          SECURITY_SCAN_RESULTS: ${{ steps.parse-security.outputs.security_summary }}
        run: |
          cat > security-summary.md << 'EOF'
          # 🛡️ Security Scan Summary Dashboard

          **Generated:** ${GENERATED_TIME}
          **Commit:** ${COMMIT_SHA:0:8}
          **Branch:** ${BRANCH_NAME}

          ---

          ## 📊 Security Scan Results

          | Scan Type | Status | Findings |
          |-----------|--------|----------|
          ${SECURITY_SCAN_RESULTS}

          ---

          ## 📈 Overall Status

          EOF

          # Add overall status
          if [ "${{ needs.secrets-scan.result }}" = "failure" ]; then
            echo "### ❌ Critical Security Issues" >> security-summary.md
            echo "" >> security-summary.md
            echo "Secrets were detected in the code. This must be resolved before merging." >> security-summary.md
          elif [ "${{ needs.frontend-dependency-scan.result }}" = "failure" ] || [ "${{ needs.backend-dependency-scan.result }}" = "failure" ]; then
            echo "### ⚠️ Dependency Vulnerabilities" >> security-summary.md
            echo "" >> security-summary.md
            echo "Vulnerabilities were found in dependencies. Review the artifacts for details." >> security-summary.md
          else
            echo "### ✅ Security Scans Passed" >> security-summary.md
            echo "" >> security-summary.md
            echo "No critical security issues detected. Review artifacts for any warnings." >> security-summary.md
          fi

          echo "" >> security-summary.md
          echo "---" >> security-summary.md
          echo "" >> security-summary.md
          echo "<details>" >> security-summary.md
          echo "<summary>📎 Download Detailed Reports</summary>" >> security-summary.md
          echo "" >> security-summary.md
          echo "Download detailed security reports from the workflow artifacts:" >> security-summary.md
          echo "" >> security-summary.md
          echo "- 📁 npm-audit-report.json" >> security-summary.md
          echo "- 📁 pip-audit-report.json" >> security-summary.md
          echo "- 📁 bandit-report.json" >> security-summary.md
          echo "- 📁 semgrep-report.json" >> security-summary.md
          echo "</details>" >> security-summary.md

      - name: Publish to GitHub Step Summary
        run: |
          cat security-summary.md >> $GITHUB_STEP_SUMMARY

      - name: Post as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const summary = fs.readFileSync('security-summary.md', 'utf8');

              // Find existing comment
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });

              const botComment = comments.find(comment =>
                comment.user.type === 'Bot' &&
                comment.body.includes('🛡️ Security Scan Summary Dashboard')
              );

              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: summary
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: summary
                });
              }
            } catch (error) {
              console.log('Could not post comment:', error.message);
            }

      - name: Check for critical failures
        if: |
          needs.secrets-scan.result == 'failure'
        run: |
          echo "❌ Critical security issues detected - secrets found!"
          exit 1

      - name: Security scan completed
        if: |
          needs.frontend-dependency-scan.result != 'failure' &&
          needs.backend-dependency-scan.result != 'failure' &&
          needs.python-security-scan.result != 'failure' &&
          needs.secrets-scan.result != 'failure' &&
          needs.codeql-scan.result != 'failure' &&
          needs.docker-security-scan.result != 'failure'
        run: |
          echo "✅ Security scans completed successfully!"
