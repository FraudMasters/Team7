name: Performance Regression Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/performance-regression.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/performance-regression.yml'
  schedule:
    # Run performance regression tests daily at 3 AM UTC (after performance-tests)
    - cron: '0 3 * * *'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  backend-load-tests:
    name: Backend Load Tests (Locust)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agenthr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            postgresql-client \
            redis-tools

      - name: Install Python dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install locust

      - name: Verify services are running
        run: |
          pg_isready -h localhost -p 5432
          redis-cli -h localhost -p 6379 ping

      - name: Set up environment
        working-directory: ./backend
        run: |
          cp .env.example .env || true
          echo "DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/agenthr_test" >> .env
          echo "REDIS_URL=redis://localhost:6379/0" >> .env
          echo "REDIS_CACHE_ENABLED=true" >> .env
          echo "REDIS_CACHE_KEY_PREFIX=agenthr:test" >> .env
          echo "REDIS_CACHE_DEFAULT_TTL=3600" >> .env
          echo "REDIS_CACHE_MAX_CONNECTIONS=10" >> .env

      - name: Run database migrations
        working-directory: ./backend
        run: |
          alembic upgrade head

      - name: Start backend server
        working-directory: ./backend
        run: |
          python -m uvicorn api.main:app --host 0.0.0.0 --port 8888 &
          echo $! > backend.pid
          # Wait for server to be ready
          timeout 60 sh -c 'until curl -s http://localhost:8888/health > /dev/null; do sleep 2; done'

      - name: Run Locust load tests
        working-directory: ./backend
        run: |
          locust -f tests/performance/locustfile.py \
            --headless \
            --users 50 \
            --spawn-rate 10 \
            --run-time 60s \
            --host http://localhost:8888 \
            --html ../locust-report.html \
            --json \
            --logfile ../locust.log \
            --csv ../locust-stats

      - name: Stop backend server
        working-directory: ./backend
        if: always()
        run: |
          if [ -f backend.pid ]; then
            kill $(cat backend.pid) || true
            rm backend.pid
          fi

      - name: Parse Locust results
        run: |
          python .github/scripts/parse_locust_results.py \
            --stats-file=locust-stats_stats.json \
            --output=locust-metrics.json

      - name: Fetch baseline from main branch
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main
          mkdir -p .github/baselines
          git show origin/main:.github/baselines/performance-baseline.json > .github/baselines/performance-baseline.json 2>/dev/null || echo "No baseline found on main branch"

      - name: Compare with baseline
        run: |
          python .github/scripts/compare_performance_baseline.py \
            --current=locust-metrics.json \
            --baseline=.github/baselines/performance-baseline.json \
            --threshold=0.20 \
            --output=regression-report.json

      - name: Upload load test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-load-test-results
          path: |
            locust-report.html
            locust-stats*
            locust-metrics.json
            regression-report.json
            locust.log
          retention-days: 30

      - name: Generate performance summary
        if: always()
        run: |
          python .github/scripts/generate_performance_summary.py \
            --metrics=locust-metrics.json \
            --regression=regression-report.json \
            --output=performance-summary.md

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const regression = JSON.parse(fs.readFileSync('regression-report.json', 'utf8'));
              const summary = fs.readFileSync('performance-summary.md', 'utf8');

              let comment = '## ⚡ Performance Regression Test Results\n\n';
              comment += summary + '\n';

              if (regression.has_regression) {
                comment += '### ⚠️ Performance Regressions Detected\n\n';
                comment += 'The following metrics exceed the 20% degradation threshold:\n\n';
                for (const r of regression.regressions) {
                  comment += `- **${r.endpoint}**: ${(r.degradation * 100).toFixed(1)}% slower\n`;
                  comment += `  - Current: ${r.current.toFixed(2)}ms\n`;
                  comment += `  - Baseline: ${r.baseline.toFixed(2)}ms\n`;
                  comment += `  - Threshold: ${(r.threshold * 100).toFixed(0)}%\n\n`;
                }
                comment += '❌ **Performance regression detected! Please investigate before merging.**\n';
              } else {
                comment += '### ✅ No Performance Regressions\n\n';
                comment += 'All endpoints are within acceptable performance thresholds.\n';
              }

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch (error) {
              console.log('Could not post comment:', error.message);
            }

      - name: Fail on regression
        if: github.event_name == 'pull_request'
        run: |
          if [ -f regression-report.json ]; then
            HAS_REGRESSION=$(python -c "import json; print(json.load(open('regression-report.json')).get('has_regression', False))")
            if [ "$HAS_REGRESSION" = "True" ]; then
              echo "::error::Performance regression detected. See report for details."
              exit 1
            fi
          fi

      - name: Update baseline
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          mkdir -p .github/baselines
          cp locust-metrics.json .github/baselines/performance-baseline.json

      - name: Commit updated baseline
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .github/baselines/performance-baseline.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update performance baseline [skip ci]"

      - name: Push changes
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}

  frontend-load-tests:
    name: Frontend Load Tests (Lighthouse)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Start dev server
        working-directory: ./frontend
        run: |
          npm run preview -- --host 0.0.0.0 --port 5173 &
          echo $! > frontend.pid
          # Wait for server to be ready
          timeout 60 sh -c 'until curl -s http://localhost:5173 > /dev/null; do sleep 2; done'

      - name: Run Lighthouse CI
        working-directory: ./frontend
        run: |
          npx lhci autorun \
            --collect.url=http://localhost:5173 \
            --collect.url=http://localhost:5173/login \
            --collect.url=http://localhost:5173/vacancies \
            --collect.numRuns=3 \
            --assert.presets=lighthouse:recommended

      - name: Stop dev server
        working-directory: ./frontend
        if: always()
        run: |
          if [ -f frontend.pid ]; then
            kill $(cat frontend.pid) || true
            rm frontend.pid
          fi

      - name: Parse Lighthouse results
        if: always()
        id: parse-lighthouse-results
        working-directory: ./frontend
        run: |
          # Find the most recent results JSON
          RESULTS_FILE=$(ls -t .lighthouseci/*.json 2>/dev/null | head -1 || echo "")
          if [ -z "$RESULTS_FILE" ]; then
            echo "No Lighthouse results found"
            exit 1
          fi

          # Extract scores using jq
          PERFORMANCE=$(jq -r '.[0].categories.performance.score * 100' "$RESULTS_FILE" || echo "0")
          BEST_PRACTICES=$(jq -r '.[0].categories["best-practices"].score * 100' "$RESULTS_FILE" || echo "0")
          ACCESSIBILITY=$(jq -r '.[0].categories.accessibility.score * 100' "$RESULTS_FILE" || echo "0")
          SEO=$(jq -r '.[0].categories.seo.score * 100' "$RESULTS_FILE" || echo "0")
          PWA=$(jq -r '.[0].categories.pwa.score * 100' "$RESULTS_FILE" || echo "0")

          echo "performance=$PERFORMANCE" >> $GITHUB_OUTPUT
          echo "best_practices=$BEST_PRACTICES" >> $GITHUB_OUTPUT
          echo "accessibility=$ACCESSIBILITY" >> $GITHUB_OUTPUT
          echo "seo=$SEO" >> $GITHUB_OUTPUT
          echo "pwa=$PWA" >> $GITHUB_OUTPUT

          echo "### Lighthouse Scores 📊" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Category | Score | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Performance | $PERFORMANCE | $(if [ "$PERFORMANCE" -ge 90 ]; then echo "✅"; elif [ "$PERFORMANCE" -ge 50 ]; then echo "⚠️"; else echo "❌"; fi) |" >> $GITHUB_STEP_SUMMARY
          echo "| Best Practices | $BEST_PRACTICES | $(if [ "$BEST_PRACTICES" -ge 90 ]; then echo "✅"; elif [ "$BEST_PRACTICES" -ge 50 ]; then echo "⚠️"; else echo "❌"; fi) |" >> $GITHUB_STEP_SUMMARY
          echo "| Accessibility | $ACCESSIBILITY | $(if [ "$ACCESSIBILITY" -ge 90 ]; then echo "✅"; elif [ "$ACCESSIBILITY" -ge 50 ]; then echo "⚠️"; else echo "❌"; fi) |" >> $GITHUB_STEP_SUMMARY
          echo "| SEO | $SEO | $(if [ "$SEO" -ge 90 ]; then echo "✅"; elif [ "$SEO" -ge 50 ]; then echo "⚠️"; else echo "❌"; fi) |" >> $GITHUB_STEP_SUMMARY
          echo "| PWA | $PWA | $(if [ "$PWA" -ge 90 ]; then echo "✅"; elif [ "$PWA" -ge 50 ]; then echo "⚠️"; else echo "❌"; fi) |" >> $GITHUB_STEP_SUMMARY

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-lighthouse-results
          path: |
            frontend/.lighthouseci/
          retention-days: 30

      - name: Save frontend baseline results
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          mkdir -p .github/baselines
          cp frontend/.lighthouseci/*.json .github/baselines/lighthouse-baseline.json || true

      - name: Commit updated frontend baseline
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .github/baselines/lighthouse-baseline.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update Lighthouse baseline [skip ci]"

      - name: Push frontend baseline changes
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}

  performance-summary:
    name: Performance Test Summary Dashboard
    runs-on: ubuntu-latest
    needs: [backend-load-tests, frontend-load-tests]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download backend results
        uses: actions/download-artifact@v4
        with:
          name: backend-load-test-results
          path: backend-results/
        continue-on-error: true

      - name: Download frontend results
        uses: actions/download-artifact@v4
        with:
          name: frontend-lighthouse-results
          path: frontend-results/
        continue-on-error: true

      - name: Parse performance data
        id: parse-perf
        run: |
          # Parse backend Locust results
          if [ -f backend-results/locust-metrics.json ]; then
            # Extract key metrics
            BACKEND_RPS=$(jq -r '.requests_per_second // "N/A"' backend-results/locust-metrics.json)
            BACKEND_FAILURES=$(jq -r '.failures // "0"' backend-results/locust-metrics.json)
            BACKEND_P95=$(jq -r '.response_time_percentiles["95"] // "N/A"' backend-results/locust-metrics.json)

            echo "backend_rps=$BACKEND_RPS" >> $GITHUB_OUTPUT
            echo "backend_failures=$BACKEND_FAILURES" >> $GITHUB_OUTPUT
            echo "backend_p95=$BACKEND_P95" >> $GITHUB_OUTPUT
          fi

          # Parse regression report
          if [ -f backend-results/regression-report.json ]; then
            HAS_REGRESSION=$(jq -r '.has_regression // false' backend-results/regression-report.json)
            echo "has_regression=$HAS_REGRESSION" >> $GITHUB_OUTPUT
          fi

          # Parse frontend Lighthouse results
          LIGHTHOUSE_FILE=$(find frontend-results -name "*.json" -type f | head -1 || echo "")
          if [ -n "$LIGHTHOUSE_FILE" ]; then
            PERF_SCORE=$(jq -r '.[0].categories.performance.score * 100 // 0' "$LIGHTHOUSE_FILE")
            BP_SCORE=$(jq -r '.[0].categories["best-practices"].score * 100 // 0' "$LIGHTHOUSE_FILE")
            A11Y_SCORE=$(jq -r '.[0].categories.accessibility.score * 100 // 0' "$LIGHTHOUSE_FILE")

            echo "lighthouse_performance=$PERF_SCORE" >> $GITHUB_OUTPUT
            echo "lighthouse_best_practices=$BP_SCORE" >> $GITHUB_OUTPUT
            echo "lighthouse_accessibility=$A11Y_SCORE" >> $GITHUB_OUTPUT
          fi

      - name: Generate combined summary
        env:
          GENERATED_TIME: ${{ github.event.head_commit.timestamp }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          python .github/scripts/generate_combined_performance_summary.py \
            --backend-results=backend-results/ \
            --frontend-results=frontend-results/ \
            --output=combined-summary.md || true

      - name: Create performance summary dashboard
        if: hashFiles('combined-summary.md') == ''
        env:
          GENERATED_TIME: ${{ github.event.head_commit.timestamp }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
          BACKEND_RPS: ${{ steps.parse-perf.outputs.backend_rps }}
          BACKEND_FAILURES: ${{ steps.parse-perf.outputs.backend_failures }}
          BACKEND_P95: ${{ steps.parse-perf.outputs.backend_p95 }}
          HAS_REGRESSION: ${{ steps.parse-perf.outputs.has_regression }}
          LH_PERF: ${{ steps.parse-perf.outputs.lighthouse_performance }}
          LH_BP: ${{ steps.parse-perf.outputs.lighthouse_best_practices }}
          LH_A11Y: ${{ steps.parse-perf.outputs.lighthouse_accessibility }}
        run: |
          cat > performance-dashboard.md << 'EOF'
          # ⚡ Performance Test Summary Dashboard

          **Generated:** ${GENERATED_TIME}
          **Commit:** ${COMMIT_SHA:0:8}
          **Branch:** ${BRANCH_NAME}

          ---

          ## 📊 Backend Load Tests (Locust)

          | Metric | Value |
          |--------|-------|
          | Requests/Second | ${BACKEND_RPS:-N/A} |
          | Failures | ${BACKEND_FAILURES:-0} |
          | 95th Percentile | ${BACKEND_P95:-N/A} ms |

          ### Regression Status
          EOF

          if [ "${HAS_REGRESSION}" = "True" ]; then
            echo "### ⚠️ Performance Regressions Detected" >> performance-dashboard.md
            echo "" >> performance-dashboard.md
            echo "Performance has degraded beyond the 20% threshold. Review the detailed report for specifics." >> performance-dashboard.md
          else
            echo "### ✅ No Performance Regressions" >> performance-dashboard.md
            echo "" >> performance-dashboard.md
            echo "All endpoints are performing within acceptable thresholds." >> performance-dashboard.md
          fi

          echo "" >> performance-dashboard.md
          echo "---" >> performance-dashboard.md
          echo "" >> performance-dashboard.md
          echo "## 📊 Frontend Lighthouse Scores" >> performance-dashboard.md
          echo "" >> performance-dashboard.md

          if [ -n "${LH_PERF}" ]; then
            echo "| Category | Score | Status |" >> performance-dashboard.md
            echo "|----------|-------|--------|" >> performance-dashboard.md

            for cat in "Performance:${LH_PERF}" "Best Practices:${LH_BP}" "Accessibility:${LH_A11Y}"; do
              NAME="${cat%%:*}"
              SCORE="${cat##*:}"
              if [ "$((SCORE))" -ge 90 ]; then
                STATUS="✅"
              elif [ "$((SCORE))" -ge 50 ]; then
                STATUS="⚠️"
              else
                STATUS="❌"
              fi
              echo "| ${NAME} | ${SCORE} | ${STATUS} |" >> performance-dashboard.md
            done
          else
            echo "No Lighthouse results available." >> performance-dashboard.md
          fi

          echo "" >> performance-dashboard.md
          echo "---" >> performance-dashboard.md
          echo "" >> performance-dashboard.md
          echo "<details>" >> performance-dashboard.md
          echo "<summary>📎 Download Detailed Reports</summary>" >> performance-dashboard.md
          echo "" >> performance-dashboard.md
          echo "Download detailed performance reports from the workflow artifacts." >> performance-dashboard.md
          echo "</details>" >> performance-dashboard.md

      - name: Publish to GitHub Step Summary
        run: |
          if [ -f combined-summary.md ]; then
            cat combined-summary.md >> $GITHUB_STEP_SUMMARY
          else
            cat performance-dashboard.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Post as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const summary = fs.readFileSync(fs.existsSync('combined-summary.md') ? 'combined-summary.md' : 'performance-dashboard.md', 'utf8');

              // Find existing comment
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });

              const botComment = comments.find(comment =>
                comment.user.type === 'Bot' &&
                comment.body.includes('⚡ Performance Test Summary Dashboard')
              );

              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: summary
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: summary
                });
              }
            } catch (error) {
              console.log('Could not post comment:', error.message);
            }

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: performance-summary-dashboard
          path: |
            combined-summary.md
            performance-dashboard.md
          retention-days: 30
