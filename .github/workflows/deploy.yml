name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.11'

jobs:
  # Run all tests before deployment
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agenthr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: ./frontend
        run: |
          npm run lint
          npm run test:coverage

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/agenthr_test
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest tests/ -v --cov=. --cov-report=xml

      - name: Test Summary
        run: |
          echo "✅ All tests passed successfully!"
          echo "Frontend: Linting and coverage tests passed"
          echo "Backend: Pytest with coverage passed"

  # Frontend deployment to Vercel (CDN)
  deploy-frontend:
    name: Deploy Frontend to CDN
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          npm run build
          # Verify build output
          ls -lah dist/
          du -sh dist/assets/*.js | sort -h | tail -5

      - name: Check bundle size
        working-directory: ./frontend
        run: |
          echo "### Bundle Size Report 📦" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          du -h dist/assets/*.js | sort -h | awk '{print "| " $2 " | " $1 " |"}' >> $GITHUB_STEP_SUMMARY

      - name: Deploy to Vercel (Staging)
        if: github.ref == 'refs/heads/main'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./frontend

      - name: Deploy to Vercel (Production)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./frontend

      - name: Deploy to Vercel (Preview)
        id: vercel-preview
        if: github.event_name == 'pull_request'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./frontend

      - name: Run Lighthouse CI
        if: github.event_name == 'pull_request'
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: |
            ${{ steps.vercel-preview.outputs.preview-url }}
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Comment PR with deployment URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.vercel-preview.outputs.preview-url }}';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🚀 Preview Deployment Ready!\n\n**Frontend URL:** ${url}\n\n✅ All tests passed and bundle is optimized for CDN delivery.`
            });

  # Backend deployment
  deploy-backend:
    name: Deploy Backend API
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
    needs: [test, deploy-frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Docker image
        run: |
          docker build -t agenthr-backend:${{ github.sha }} ./backend

      - name: Push to registry (Staging)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Pushing image to container registry for staging..."
          # Add actual registry push commands here
          # docker tag agenthr-backend:${{ github.sha }} registry.example.com/agenthr-backend:staging
          # docker push registry.example.com/agenthr-backend:staging

      - name: Deploy to staging
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Deploying backend to staging environment..."
          # Add deployment commands here (kubectl, helm, etc.)

      - name: Push to registry (Production)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "Pushing image to container registry for production..."
          # Add actual registry push commands here
          # docker tag agenthr-backend:${{ github.sha }} registry.example.com/agenthr-backend:latest
          # docker push registry.example.com/agenthr-backend:latest

      - name: Deploy to production
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "Deploying backend to production environment..."
          # Add deployment commands here (kubectl, helm, etc.)

      - name: Run basic smoke tests (Staging)
        if: github.ref == 'refs/heads/main'
        run: |
          # Basic smoke tests against staging deployment
          curl -f https://api-staging.agenthr.com/health || exit 1
          curl -f https://api-staging.agenthr.com/api/candidates/ || exit 1

      - name: Run basic smoke tests (Production)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Basic smoke tests against production deployment
          curl -f https://api.agenthr.com/health || exit 1
          curl -f https://api.agenthr.com/api/candidates/ || exit 1

  # CDN invalidation for Cloudflare (optional)
  invalidate-cdn:
    name: Invalidate CDN Cache
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [test, deploy-frontend, deploy-backend]

    steps:
      - name: Purge Cloudflare cache (Staging)
        if: github.ref == 'refs/heads/main'
        uses: jakejarvis/cloudflare-purge-action@master
        env:
          CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_STAGING_ZONE_ID }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        with:
          path: |
            https://staging.agenthr.com/assets/*
            https://staging.agenthr.com/*.js
            https://staging.agenthr.com/*.css

      - name: Verify CDN cache cleared (Staging)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "CDN cache invalidated for staging static assets"
          echo "New assets will be served from origin"

      - name: Purge Cloudflare cache (Production)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: jakejarvis/cloudflare-purge-action@master
        env:
          CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        with:
          path: |
            https://agenthr.com/assets/*
            https://agenthr.com/*.js
            https://agenthr.com/*.css

      - name: Verify CDN cache cleared (Production)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "CDN cache invalidated for production static assets"
          echo "New assets will be served from origin"

  # Comprehensive smoke tests after deployment
  smoke-tests:
    name: Run Smoke Tests
    runs-on: ubuntu-latest
    needs: [test, deploy-frontend, deploy-backend]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup smoke test script
        run: |
          chmod +x scripts/smoke-tests.sh
          echo "Smoke test script ready"

      - name: Run smoke tests (Staging)
        if: github.ref == 'refs/heads/main'
        env:
          FRONTEND_URL: https://staging.agenthr.com
          API_URL: https://api-staging.agenthr.com
        run: |
          scripts/smoke-tests.sh "${FRONTEND_URL}" "${API_URL}" "staging"

      - name: Run smoke tests (Production)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          FRONTEND_URL: https://agenthr.com
          API_URL: https://api.agenthr.com
        run: |
          scripts/smoke-tests.sh "${FRONTEND_URL}" "${API_URL}" "production"

      - name: Generate smoke test report
        if: always()
        run: |
          echo "### Smoke Test Results 🧪" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ **All smoke tests passed**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Smoke tests failed** - Check logs for details" >> $GITHUB_STEP_SUMMARY
          fi

  # Deployment notification
  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [test, deploy-frontend, deploy-backend, invalidate-cdn, smoke-tests]
    if: always()

    steps:
      - name: Send Slack notification
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            Deployment ${{ job.status }}!
            Environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            Smoke Tests: ${{ needs.smoke-tests.result }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Update deployment status
        run: |
          echo "Deployment completed with status: ${{ job.status }}"
          echo "Environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}"
